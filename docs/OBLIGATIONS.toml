note        = """
Cited ONLY by pin-overridden models -- `tla/AuthoritySelect.tla` and its Apalache port, at
`spec-data/v0.8.2.25`, 2026-09-16. DISPOSITION STAYS `UNEXAMINED` AND THE NOTE SAYS WHY RATHER
THAN ROUNDING UP.

What those models are about is §6.3's `check_path_permission` as a CALL SITE for §6.8's
authority-selection rule: which authority its `authority` argument carries. They do not
transcribe ONE of this row's seven PIN obligations. The pin's §6.3 MUSTs are the two-level
authorization contract -- dispatch scope via `check_permission`, path scope via
`check_path_permission`, *"Both checks MUST pass"*, the listing filter, and the pagination
ordering -- and nothing here verifies any of them as the pin states them.

⭐ AND THE PIN'S TEXT IS ITSELF EVIDENCE FOR THE FINDING THOSE MODELS ROUTE, which is why this
note is longer than the row. At `v0.8.2` the listing filter reads *"each entry MUST be
individually checked against THE REQUEST'S CAPABILITY"* -- ONE authority, singular, and the
`check_path_permission` signature that takes one `authority` argument matches it exactly. By
`v0.8.2.25` the same paragraph reads *"The authority is §6.8 ROW 1 -- the caller's verified
capability, with the executing handler's grant as a ceiling; BOTH MUST PASS"*, and THE SIGNATURE
DID NOT MOVE. So the single-authority shape is not a drafting slip: it is the residue of a text
in which a single authority WAS the whole rule, left behind when the rule grew a conjunction.
That is the same failure 0.8.2.24 names one clause over -- *a generalization that changes which
object a qualifier attaches to has to say what happened to the qualifier*.
"""

