# docs/OBLIGATIONS.toml -- the normative surface OUTSIDE the models, declared.
#
# Gated by `make obligations` (tools/obligations.py). The counts below are DERIVED from each
# track's pinned primary spec and fail the build when they disagree with it. Every section that
# carries at least one MUST/MUST NOT and is cited by no model of its track has a row here.
#
# WHY THIS FILE EXISTS. Every other gate in this repo divides by an artifact of ours: `coverage`
# by the sections our models cite, `runcount` by our gate tables, `enginecount` by our green
# tables, `ledgercount` by our ledger. On 2026-09-14 a capability forgery was closed upstream
# whose enabling text -- `spec-data/v0.8.2` §3.1, *"The content_hash MUST match the map key"* --
# sat in our pin with no enforcing operation and no vector, which is precisely the shape D17 was
# ratified to report. Nothing here was red, because nothing here was looking.
# See `docs/status/AUDIT-2026-09-14-THE-DENOMINATOR-WAS-OUR-OWN-CITATIONS.md`.
#
# THE DISPOSITION VOCABULARY IS CLOSED, and `UNEXAMINED` is the honest default:
#   modeled-elsewhere  another track's models cover it. Name which, in `note`.
#   out-of-scope       named reason, in `note`. A shrug is not a reason.
#   UNEXAMINED         nobody has read this section against the models. Not safe -- honest.
#
# DO NOT change an `UNEXAMINED` to anything else without doing the reading. The headline the
# gate prints is the UNEXAMINED obligation count, deliberately: the number a reader sees is the
# size of the hole, not the fact that somebody wrote it down.

