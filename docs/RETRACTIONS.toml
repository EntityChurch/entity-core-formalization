# RETRACTIONS — claims this repo has published and withdrawn.
#
# Read `tools/retractcheck.py` first; `make retractcheck` is the gate.
#
# WHY THIS FILE EXISTS
# --------------------
# D14 says a finding is not closed until it is applied to every instance of its shape, and it
# says something sharper about withdrawn claims specifically:
#
#     "A withdrawn claim has a shape, and the shape is its PHRASING, not its subject — grep the
#      retracted words, because the row name appears in every site including the corrected ones
#      and finds nothing."
#
# That rule was earned three times (the L7 retraction surviving in three canonical documents;
# the `:Z` reason surviving in five places including a copy-pasteable reproduce command; the
# "every module is covered by all three engines" quantifier surviving four) and its enforcement
# point was the word "grep" — a discipline with no program behind it. On 2026-09-09 it failed a
# fourth time and a fifth: `docs/STATUS.md`'s proof-tracks table and `docs/COVERAGE-MATRIX.md`
# §3c both still stated the pre-2026-09-09 engine position with `make runcount` and
# `make enginecount` green over both, because a derived-number gate cannot see a PARAPHRASE.
#
# HOW A ROW WORKS
# ---------------
#   pattern   regex, matched against every live document with blockquote/comment sigils
#             stripped and whitespace collapsed — so a re-wrap or a `\*` comment prefix cannot
#             launder the claim. MUST match ZERO times outside `witness` + `allow`.
#   witness   a document that MUST still contain the phrasing. This is the row's own positive
#             control: a pattern that matches nothing anywhere reports a clean pass forever,
#             which is the D13 failure this whole repo is built around. Implicitly allowed.
#   allow     other documents that legitimately quote the withdrawn words — normally because
#             they RECORD the retraction. Adding one to silence a real hit is the way to make
#             this gate worthless; the failure message says so and the diff shows it.
#
# WHAT THIS FILE IS NOT
# ---------------------
# Complete. Nothing can derive the set of claims we have withdrawn — it is a human reading, and
# a retraction with no row here is invisible to the gate exactly as it was before the gate
# existed. **Add the row in the session that retracts.** That is the discipline; this file is
# only the part a machine can hold.

# ── 2026-08-30 ─────────────────────────────────────────────────────────────────────────────

[[retraction]]
id      = "R1"
retired = "2026-08-30"
claim   = "ProVerif and Lean share one undischarged assumption (`hframed`)"
why     = """Wrong in both halves. There are three `canon` equations four lines apart and the
second is `hframed`'s NEGATION; `hframed` is not an unproved lemma, it is false in `canonSegs`'
absolute branch. Assembled from a grep hit that agreed with a hypothesis already formed. It then
survived in three canonical documents after being corrected in two, which is what earned D14's
grep-the-phrasing rule."""
pattern = "shared? (an? )?undischarged assumption"
witness = "AGENTS.md"
allow   = ["CHANGELOG.md", "docs/STATUS.md", "docs/LEAN-SEAM.md"]

[[retraction]]
id      = "R2"
retired = "2026-08-30"
claim   = "run the engines serially because concurrent `:Z` relabels race"
why     = """Not a platform quirk — our own defect. Uppercase `:Z` relabels a volume PRIVATE to
one container, so on a directory shared by two images the second relabel invalidates the first.
The fix is `:z` on shared mounts. The retracted REASON outlived the code fix in five places,
worst of them a copy-pasteable reproduce command in `CROSSCHECK-RESULTS.md` handing a reader
`-v "$PWD":/work:Z` on the exact directory and image the bug involved. Serial execution remains
the rule, for resource-cap reasons."""
pattern = "concurrent `?:Z`? relabels? (race|cause)"
witness = "AGENTS.md"
allow   = ["docs/STATUS.md", "CHANGELOG.md"]

