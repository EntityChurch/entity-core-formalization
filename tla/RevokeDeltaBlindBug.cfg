\* NEGATIVE CONTROL (§5.10, 0.8.1 W7 Knob 3) — "delta applied but not declared".
\*
\* The defect: a verifier that applies a skew tolerance at the temporal boundary WITHOUT
\* declaring it as a Layer-1 input. §5.10 admits `delta` only on the condition that "it
\* introduces no concealed state"; a peer whose tolerance is not a declared input has made its
\* verdict a function of hidden state, which is exactly what the cross-peer determinism MUST
\* forbids. Two such peers hand the same bytes to the same chain at the same `t` and disagree,
\* and neither can explain why from its declared inputs.
\*
\* This config asserts the PRE-0.8.3 determinism invariant — the one whose antecedent is blind
\* to `delta` — against a model in which peers may declare different tolerances.
\*
\* EXPECTED VERDICT: VIOLATION of VerdictFnOfLayer1_DeltaBlind.
\* Run: make tlc SPEC=Revoke CFG=RevokeDeltaBlindBug
\*
\* D13 — what does this assert, and what else satisfies it? A violation says two peers agreeing
\* on `t` and on observed-revocation state still disagreed. It does NOT by itself say `delta`
\* caused that: this invariant cannot see `delta`. The companion `RevokeDeltaWitness` is the
\* measurement that closes the gap, requiring `delta` to differ IN the violating state. Both
\* rows are declared in tla/Makefile because the pair is the claim, not either one alone.
SPECIFICATION Spec
CONSTANT HonorRevocation = TRUE
CONSTANT LeakLayer1 = FALSE
CONSTANT NoConverge = FALSE
CONSTANT PropBound = 2
CONSTANT MaxTick = 4
CONSTANT DeltaVals = {0, 1}
CONSTANT BoundedPropagation = TRUE
INVARIANT VerdictFnOfLayer1_DeltaBlind
