\* §4.1 GREEN — the K-of-N validator over every resolution map, threshold, signature set and
\* resolvability assignment on three slots and three peers.
\*
\* CreateValidates = TRUE is the constraint all three implementations supply and that §6.2
\* writes for `:update` only; the QuorumKofNThreshold config runs the same invariant under §6.1
\* and §3.1 as written. The other two constants are §4.1 as written and their controls follow.
\*
\* D13 note: this cfg declares INVARIANTs -- `tlc-green` requires at least one, because TLC
\* enumerates the state space, checks nothing and exits 0 on a cfg declaring none.
SPECIFICATION Spec

CONSTANTS
  NS              = 3
  NP              = 3
  CreateValidates = TRUE
  DedupeByPeer    = TRUE
  ResolveChecked  = TRUE

INVARIANTS
  TypeOK
  KofNRequiresASignature
  DedupeCountsPeersOnce
  UnresolvableNeverCounts
