\* §5.7 I5 NEGATIVE CONTROL — KindGate = FALSE.
\* The defect: every attestation is published to the `properties.kind` index, including
\* kind-less `a3`. I5: "Attestations without a `kind` key MUST NOT appear in the
\* properties.kind index." This is the control for the conditional-index reading -- an
\* implementation that indexes unconditionally passes a naive "in all four indexes" check
\* and fails this one, which is the whole reason the eligibility form is used above.
\* MUST FAIL on KindIndexEligibleOnly.
\* Expected verdict: `Invariant KindIndexEligibleOnly is violated.`
SPECIFICATION Spec

CONSTANTS
  AtomicIndex    = TRUE
  KindGate       = FALSE
  RetainOnRevoke = TRUE
  SequencedIndex = TRUE

INVARIANTS
  KindIndexEligibleOnly
