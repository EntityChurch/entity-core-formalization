\* §4.3 FINDING — the consequence of its sibling, and the one that matters. Same unweakened
\* model. It is not merely that an undefined helper has two readings; the two readings give
\* `is_attestation_live` DIFFERENT ANSWERS about the same attestation, and that predicate is
\* what every consumer's authorization decision runs through.
\*
\* The counterexample is worth reading in full, because it is the documented
\* predecessor-revival semantics being switched on and off by an undefined helper. Node 3
\* supersedes node 1; node 4 revokes node 3; node 4 is expired. Recursively the expired
\* revocation does not count, so node 3 is live, so node 1 is superseded and DEAD.
\* Structurally it does count, so node 3 is dead, so nothing live supersedes node 1 and it is
\* ALIVE. One attestation, two answers, and the deciding term is a function the document never
\* defines.
\*
\* Expected verdict: `Invariant LiveReadingsAgree is violated.`
SPECIFICATION Spec

CONSTANTS
  N                = 4
  Peers            = {1, 2}
  AuthorityRevoke  = FALSE
  RecursiveMainRev = TRUE

INVARIANTS
  LiveReadingsAgree
