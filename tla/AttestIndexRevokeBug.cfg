\* §5.7 I4 NEGATIVE CONTROL — RetainOnRevoke = FALSE.
\* The defect: revocation DE-INDEXES the attestation. I4: the entity "remains in the tree and
\* in the indexes ... Indexes do NOT filter by liveness." An implementation that treats the
\* index as a liveness cache makes find_* stop returning revoked entities, which silently
\* breaks every consumer that relies on is_attestation_live to do that filtering itself --
\* including the authority-revocation pattern §4.4 describes for consumers.
\* MUST FAIL on IndexRetainedOnRevoke.
\* Expected verdict: `Invariant IndexRetainedOnRevoke is violated.`
SPECIFICATION Spec

CONSTANTS
  AtomicIndex    = TRUE
  KindGate       = TRUE
  RetainOnRevoke = FALSE
  SequencedIndex = TRUE

INVARIANTS
  IndexRetainedOnRevoke
