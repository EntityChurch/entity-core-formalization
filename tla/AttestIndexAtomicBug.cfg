\* §5.7 I2 NEGATIVE CONTROL — AtomicIndex = FALSE.
\* The defect: a handler that FAILS leaves behind the index entries it had already published,
\* instead of rolling them back. The entity is in no tree and in some indexes: exactly the
\* "partial-index state" I2 says is NOT permitted, and it is permanent rather than in flight.
\* MUST FAIL, and must fail on NoResidueOnFailure -- not on a neighbouring invariant.
\* Expected verdict: `Invariant NoResidueOnFailure is violated.`
SPECIFICATION Spec

CONSTANTS
  AtomicIndex    = FALSE
  KindGate       = TRUE
  RetainOnRevoke = TRUE
  SequencedIndex = TRUE

INVARIANTS
  NoResidueOnFailure
