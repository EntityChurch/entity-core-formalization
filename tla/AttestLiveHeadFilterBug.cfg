\* §5.3 NEGATIVE CONTROL — DagFiltersLive = FALSE.
\* The defect: the forward-DAG algorithm keeps its enumeration and its tie-break but drops the
\* liveness filter, so it returns the furthest node in the chain rather than the live head.
\* This is the plausible wrong way to fix §5.3 -- "walk through dead intermediates" read as
\* "ignore liveness" instead of "apply it once at the end" -- and DagHeadIsLive is what
\* separates the two.
\*
\* The counterexample TLC reports is SMALLER than that story: a single self-revoked node with
\* no edges at all, which the unfiltered algorithm returns as its own head. Recorded here
\* rather than engineered away, because the minimal witness is the honest one and a control
\* whose stated scenario is richer than the state it actually reaches is the shape this repo
\* keeps catching itself in.
\*
\* MUST FAIL, and must fail on DagHeadIsLive.
\* Expected verdict: `Invariant DagHeadIsLive is violated.`
SPECIFICATION Spec

CONSTANTS
  N              = 3
  AllowCycles    = TRUE
  LiveTransitive = TRUE
  DagFiltersLive = FALSE

INVARIANTS
  DagHeadIsLive
