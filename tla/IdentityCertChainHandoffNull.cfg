\* §3.6 FINDING -- NOT a negative control. TargetGuarded = FALSE is §3.6 AS WRITTEN. Every other
\* constant is the green sweep's.
\*
\* `identity_topology_for`'s handoff arm calls `lookup_target_cert(att, ctx)` and immediately
\* dereferences `target.attested`, with no null check. §3.6 documents the helper as returning
\* "attestation or null" and its body ends `return ctx.content_store.get(target_hash)`. Twenty
\* lines above, in the SAME section, `identity_confers_function` calls the same helper and does
\* guard it: `if target is null: return false`.
\*
\* An unresolvable target is reachable without an attacker: §4.3 stores a handoff at the same
\* audience tier as its target, and §5.2's sync tiers promise no arrival ordering between them.
\*
\* Go's shortcut (see IdentityCertChainHandoffSigner) sidesteps this by never looking the target
\* up, which is why the invariant is scoped by HandoffSignerFromTarget: the implementation that
\* diverges on the signer list is the one that cannot reach the null dereference. One asymmetry
\* inside one section, read two ways.
\*
\* THE STATE TLC EXHIBITS: `kind = 2`, `tres = FALSE`.
