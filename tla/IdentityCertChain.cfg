\* §3.6 GREEN. Constants are the readings under which the document is CONSISTENT WITH ITSELF,
\* which on this module is not the same as "the spec as written" -- three of them are the
\* repairs the four findings ask for, and one (SignerSetIsSound) is a declared assumption about
\* another track. Every one is named in the module header and each finding cfg flips exactly one.
\*
\* AgentPublicAllowed = FALSE is §9.2's MUST read as narrowing §4.2's valid-modes table. That is
\* a CHOICE between two normative statements that cannot both hold, made here so the rest of the
\* module has a consistent base to be green against; IdentityCertChainPublicSig runs §4.2a's
\* reading and is the finding.
\*
\* D13 note: this cfg declares INVARIANTs -- `tlc-green` requires at least one, because TLC
\* enumerates the state space, checks nothing and exits 0 on a cfg declaring none.
SPECIFICATION Spec

CONSTANTS
  SignerSetIsSound        = TRUE
  TopologyFirst           = TRUE
  AgentPublicAllowed      = FALSE
  RevocationAdmitted      = TRUE
  RevocationDispatched    = TRUE
  HandoffSignerFromTarget = TRUE
  TargetGuarded           = TRUE
  HandoffIsDualSig        = TRUE
  HandoffIdentityEnforced = TRUE

INVARIANTS
  TypeOK
  PublicPathNeverControllerSigned
  RevocationReachesTopology
  HandoffReadingsCoincide
  HandoffTargetGuarded
  TopLevelControllerIsKofN
  SubControllerIsSingle
  HandoffIsDual
  LifecycleIsQuorumDriven
  KofNAnswerIsTrustworthy
