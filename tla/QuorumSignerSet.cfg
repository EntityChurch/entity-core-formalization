\* §4.2 GREEN — the signer-set resolver over every supersedes configuration on three
\* quorum-update attestations, crossed with every not_before / expires_at assignment on a
\* two-instant clock.
\*
\* Every green here is a COHORT result, not a spec result: ProbeAllUpdates = TRUE and
\* DescTemporal = TRUE together are what Go, Rust and Python each independently implemented,
\* and neither is what EXTENSION-QUORUM §4.2 / EXTENSION-ATTESTATION §4.3 write. The spec's own
\* algorithm is checked in the four QuorumSignerSet*-finding configs, where it fails.
\*
\* D13 note: this cfg declares INVARIANTs -- `tlc-green` requires at least one, because TLC
\* enumerates the state space, checks nothing and exits 0 on a cfg declaring none.
SPECIFICATION Spec

CONSTANTS
  N               = 3
  T               = 2
  ProbeAllUpdates = TRUE
  DescTemporal    = TRUE

INVARIANTS
  TypeOK
  CohortMatchesNormativeOnChain
  CohortNeverSilentlyReverts
  ResolvedHeadIsCurrent
