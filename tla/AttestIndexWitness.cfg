\* NON-VACUITY WITNESS for §5.7 (PROPERTIES.md §C.4). WitnessAttestBound is asserted in order
\* to be VIOLATED -- the violation is the PASS, a clean run is a build failure. It exhibits a
\* reachable state in which an attestation is actually BOUND and fully indexed, so I1-I5 are
\* not vacuously true of a peer that never successfully writes one.
\*
\* ONE INVARIANT PER WITNESS CFG, deliberately. This cfg's first draft declared this AND
\* WitnessPartialEligibility together; TLC stops at the FIRST violation, so the second would
\* never have been asserted while the row still declared a verdict for it. That is the
\* TM_NEG_EXPECT lesson -- a control that appears to cover N things and covers one -- so the
\* eligibility witness has its own cfg (AttestIndexEligWitness) and its own gate row.
\* Expected verdict: `Invariant WitnessAttestBound is violated.`
SPECIFICATION Spec

CONSTANTS
  AtomicIndex    = TRUE
  KindGate       = TRUE
  RetainOnRevoke = TRUE
  SequencedIndex = TRUE

INVARIANTS
  WitnessAttestBound
