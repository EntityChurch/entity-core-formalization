\* NEGATIVE CONTROL #6 — §4.11's SECOND named non-conformance: "Closing with no coded frame.
\* A bare socket close is indistinguishable from a network fault (§4.6), so the caller cannot
\* tell a defect in its own request from a defect in the path — and the two remedies are
\* opposite."
\* The pair with #5 is the point: this model emits a close and no frame, #5 emits neither, and
\* they violate DIFFERENT invariants. On a multiplexed connection §4.11 adds that this one
\* also destroys unrelated ADMITTED requests — that arm is §4.11(f), it is NOT modeled here,
\* and it is tla/Reentry.tla's subject (docs/LEAN-SEAM.md O24).
\* EXPECTED VERDICT: NoBareCloseOnly VIOLATED.
\* Run: make tlc SPEC=ConnCodes CFG=ConnCodesBareCloseBug
SPECIFICATION Spec
CONSTANT CollapseCodes = FALSE
CONSTANT WrongStatus = FALSE
CONSTANT SeqReadingBug = FALSE
CONSTANT AuthBeforeAddress = FALSE
CONSTANT RefusalMode = "bare_close"
CONSTANT EcfOnFraming = FALSE
INVARIANT NoBareCloseOnly
