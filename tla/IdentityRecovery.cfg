\*
\* READ RecoveryFailClosed HERE AGAINST ITS OWN WITNESS. It is a negative-reachability claim and
\* it is green in every cfg on this module, INCLUDING the two where §6.3 as written accepts
\* nothing at all. That is why IdentityRecoveryAcceptWitness exists and why finding R2 is
\* stated: a prohibition that passes on a peer which rejects everything is not evidence.
\*
\* The five finding invariants are asserted here too and are green here, so the cfg states what
