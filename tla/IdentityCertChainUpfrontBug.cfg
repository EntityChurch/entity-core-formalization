\* §3.6 / §10.1 NEGATIVE CONTROL -- weakens the model on purpose. TopologyFirst = FALSE runs a
\* single-sig check upfront, before topology dispatch.
\*
\* §10.1 forbids exactly this and names the case: "implementations MUST dispatch on topology
\* BEFORE running signature validation ... MUST NOT run a single-sig check upfront on
\* attestations whose `attesting` is a quorum_id." A quorum_id is not a keypair; a single-sig
\* check against it either fails every top-level controller cert or, worse, passes on whatever
\* single signature happens to be bound at the quorum's path.
\*
\* Expected verdict: `Invariant TopLevelControllerIsKofN is violated.`
SPECIFICATION Spec

CONSTANTS
  SignerSetIsSound        = TRUE
  TopologyFirst           = FALSE
  AgentPublicAllowed      = FALSE
  RevocationAdmitted      = TRUE
  RevocationDispatched    = TRUE
  HandoffSignerFromTarget = TRUE
  TargetGuarded           = TRUE
  HandoffIsDualSig        = TRUE
  HandoffIdentityEnforced = TRUE

INVARIANTS
  TopLevelControllerIsKofN
