\* §5.7 GREEN — the four mandatory indexes and invariants I1-I5 hold under concurrent
\* handler invocations, with the index publishes SEQUENCED (one per transition) and the
\* tree bind + final entry as the single atomic commit point.
\*
\* Every invariant here could fail and does not; each has a control that breaks exactly one.
\* D13 note: this cfg declares INVARIANTs and a PROPERTY -- `tlc-green` requires at least one,
\* because TLC enumerates the state space, checks nothing and exits 0 on a cfg declaring none.
SPECIFICATION Spec

CONSTANTS
  AtomicIndex    = TRUE
  KindGate       = TRUE
  RetainOnRevoke = TRUE
  SequencedIndex = TRUE

INVARIANTS
  IndexExactOnBound
  NoResidueOnFailure
  IndexAllOrNothing
  KindIndexEligibleOnly
  IndexRetainedOnRevoke

PROPERTY AttestSettles
