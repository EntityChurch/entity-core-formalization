\* NEGATIVE CONTROL #3 (NEW at 0.8.2) — §4.8 content-store LIFETIME REFCOUNT unsynchronized
\* (SyncRefs = FALSE), the defect named at 0.8.1 RT-13a: "an unsynchronized refcount decrement
\* from concurrent dispatch is a use-after-free, i.e. the §4.9 no-crash class".
\*
\* The counter's read-modify-write is split, so a decrement in flight can be applied to a
\* counter another request has since acquired against. Expect NoUseAfterFree VIOLATED.
\*
\* THE WITNESSED INTERLEAVING (TLC counterexample, 9 states — a STALE DECREMENT racing a
\* fresh acquire, which is the §4.8 sentence verbatim rather than a lost increment):
\*   1. req 1 admits on the shared key "k1": holders[k1] = {1}, store = {k1}, rc[k1] = 1
\*   2. req 1 responds: holders[k1] = {}, and READS rc[k1] = 1 into its local (write-back pending)
\*   3. req 2 admits on "k1": holders[k1] = {2}, and reads rc[k1] — still 1, because req 1's
\*      decrement has not landed
\*   4. req 1's write-back lands: rc[k1] := 1 - 1 = 0 -> the free fires -> store = {}
\*      while holders[k1] = {2}
\*   => "k1" is freed under a live referrer. On a manually-memory-managed substrate that is
\*      the use-after-free / double-free the §7b concurrency gate observed on two generated
\*      peers, and §4.8 classes it as a crash == a §4.9 resilience violation.
\* (ResourceBounded can also break on the mirror interleaving, where a decrement is lost and
\* the key never leaves the live set.)
\* Run: make tlc SPEC=Store CFG=StoreRefcountBug
SPECIFICATION Spec
CONSTANT NReq = 4
CONSTANT MaxPending = 2
CONSTANT MaxStore = 2
CONSTANT Serialize = TRUE
CONSTANT Admit = TRUE
CONSTANT SilentDrop = FALSE
CONSTANT SyncRefs = FALSE
INVARIANT NoUseAfterFree
INVARIANT ResourceBounded
