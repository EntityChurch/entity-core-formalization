\* §6.2 / §5.2 FINDING — NOT a negative control. Every constant is the green sweep's constant.
\*
\* §6.2 validates `new_threshold <= |new_signers|`, counting entries of the signers ARRAY. §5.2
\* registers resolution modes in which each entry is a REFERENCE resolved to a peer hash, and
\* two references can resolve to the same peer -- which §4.1's defensive dedupe then counts
\* once, correctly. So the attainable maximum is the number of distinct resolved peers, a number
\* the validated bound never sees.
\*
\* A quorum that passed every check the document states can therefore be unable to reach its own
\* threshold, for as long as the resolution holds. Not a signature-forgery question: an
\* availability one, reachable through the authorized path with valid data.
\*
\* Expected verdict: `Invariant ThresholdAttainable is violated.`
SPECIFICATION Spec

CONSTANTS
  NS              = 3
  NP              = 3
  CreateValidates = TRUE
  DedupeByPeer    = TRUE
  ResolveChecked  = TRUE

INVARIANTS
  ThresholdAttainable
