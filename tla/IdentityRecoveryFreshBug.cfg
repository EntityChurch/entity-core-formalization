\* §9.4 NEGATIVE CONTROL -- weakens the model on purpose, and it is a rule with a NAMED wrong
\* answer, which makes it a control the spec wrote for us. AnchorIsCachedPublish = FALSE
\* validates the recovery against the freshest quorum-publish SEEN rather than the one CACHED.
\*
\* §QUORUM:3.3 rules on exactly this: for supersede `quorum-publish` attestations the K-of-N
\* validation MUST use "the prior publish's `properties.signers` snapshot directly -- NOT
\* `current_signer_set` resolved at the time of the prior publish", and §9.4 says the same thing
\* on the identity side ("the contact's prior CACHED signer set is the trust anchor").
\*
\* The attack it admits is the one that motivates the rule: an attacker who can influence what
\* the contact most recently saw does not need to get it CACHED. Note that under these constants
\* SeedValidates is TRUE -- Python's admission gate is in force and keeps the forged publish out
\* of the cache -- and the wrong reading defeats it anyway by not reading the cache.
\*
\* Expected verdict: `Invariant AcceptedRecoveryIsQuorumSigned is violated.`
SPECIFICATION Spec

CONSTANTS
  SeedEnabled           = TRUE
  SeedValidates         = TRUE
  FailClosed            = TRUE
  AnchorIsCachedPublish = FALSE
  AnchorDroppedOnAccept = FALSE

INVARIANTS
  AcceptedRecoveryIsQuorumSigned
