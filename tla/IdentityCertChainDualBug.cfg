\* §4.1 / §10.1 NEGATIVE CONTROL -- weakens the model on purpose. HandoffIsDualSig = FALSE treats
\* a handoff as an ordinary single-sig cert.
\*
\* §4.1's kind table gives `identity-rotation-handoff` the topology "dual-sig (old + new)" and
\* §10.1 restates it as a MUST ("identity-rotation-handoff is dual-signed (old + new)"). Single-
\* sig would let the OLD key alone hand authority to any new key it chose -- which is the
\* difference between a handoff and a theft, and the reason §4.4 exists as a separate kind for
\* the case where the old key cannot be trusted to co-sign.
\*
\* Expected verdict: `Invariant HandoffIsDual is violated.`
SPECIFICATION Spec

CONSTANTS
  SignerSetIsSound        = TRUE
  TopologyFirst           = TRUE
  AgentPublicAllowed      = FALSE
  RevocationAdmitted      = TRUE
  RevocationDispatched    = TRUE
  HandoffSignerFromTarget = TRUE
  TargetGuarded           = TRUE
  HandoffIsDualSig        = FALSE
  HandoffIdentityEnforced = TRUE

INVARIANTS
  HandoffIsDual
