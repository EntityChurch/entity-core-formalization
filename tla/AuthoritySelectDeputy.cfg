\* ⭐ FINDING ROW, AND A FOURTH SHAPE FOR tla/Makefile:TLC_FINDING's HEADER: A COMPOSITION.
\* Its two flipped constants are of DIFFERENT KINDS and neither alone violates this invariant.
\*
\*   Row1Authorities = "caller-only"  — the spec's OWN pseudocode shape (see
\*                                      AuthoritySelectRow1Signature.cfg). A finding constant.
\*   Discriminator   = "initiator"    — a reading §6.8 names as NOT the test, and which §6.3
\*                                      records two seats shipping. A control constant.
\*
\* Under §6.8 AS WRITTEN — with row 1's ceiling present — the initiator misreading is
\* FAIL-CLOSED: row 1 demands strictly more than row 2, so misfiling an own-behalf access into
\* row 1 can only REFUSE it. That is AuthoritySelectInitiatorBug, which breaks availability, and
\* it is the green invariant MisclassificationCostsAvailabilityOnly stated as a control.
\*
\* Remove the ceiling — which is what the single-`authority` signature forces — and the SAME
\* misreading becomes an ESCALATION: the originating caller's capability alone authorizes a
\* write the executing handler's own grant does not cover, which is the confused deputy §6.8
\* forbids by name. MUST FAIL on NoDeputySubstitution.
\*
\* THE TRANSFERABLE PIECE, and it is why this is a row rather than a paragraph: the pseudocode
\* gap is not independently harmful and the discriminator error is not independently an
\* escalation. Each is visible only as a defect in the other's presence, and neither seat
\* looking at one of them would find this.
\*
\* RETIREMENT CONDITION: goes green when EITHER half is closed upstream. Retire it then; do not
\* repair it.
SPECIFICATION Spec
CONSTANT AuthoritySource = "selected"
CONSTANT Discriminator = "initiator"
CONSTANT Row1Authorities = "caller-only"
CONSTANT PeerRootChecked = FALSE
INVARIANT NoDeputySubstitution
