\* §9.4 NON-VACUITY WITNESS. Asserted in order to be VIOLATED; the violation exhibits the state
\* and IS the pass. On a module whose headline finding IS a vacuity, these are load-bearing
\* rather than a formality.
\*
\* The fail-closed branch is ever TAKEN -- a recovery delivered to a contact that has not yet
\* cached anything. Without it, `RecoveryFailClosed` could be green on a model that never
\* exercises the rule it transcribes.
\*
\* Expected verdict: `Invariant WitnessFailClosedFires is violated.`
SPECIFICATION Spec

CONSTANTS
  SeedEnabled           = TRUE
  SeedValidates         = TRUE
  FailClosed            = TRUE
  AnchorIsCachedPublish = TRUE
  AnchorDroppedOnAccept = FALSE

INVARIANTS
  WitnessFailClosedFires
