\* NON-VACUITY WITNESS for the CONDITIONAL half of §5.7 I1/I5 — the one that makes this model
\* worth writing. WitnessPartialEligibility is asserted in order to be VIOLATED.
\*
\* The violation exhibits a BOUND attestation whose eligible index set is a PROPER SUBSET of
\* the four: kind-less, non-superseding `a3` really does come to rest indexed in two indexes
\* and not four. Without it, "the entity is in exactly its eligible indexes" and the WRONG
\* reading "the entity is in all four indexes" would be indistinguishable on this model, and
\* the wrong one would pass -- a model confirming a reading the spec does not have.
\* Expected verdict: `Invariant WitnessPartialEligibility is violated.`
SPECIFICATION Spec

CONSTANTS
  AtomicIndex    = TRUE
  KindGate       = TRUE
  RetainOnRevoke = TRUE
  SequencedIndex = TRUE

INVARIANTS
  WitnessPartialEligibility
