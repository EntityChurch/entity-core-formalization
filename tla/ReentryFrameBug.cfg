\* NEGATIVE CONTROL (NEW at 0.8.2) — V7 §6.11(a′) frame-write atomicity dropped
\* (AtomicFrame = FALSE), the defect named at 0.8.1 RT-13b: "a yielding write primitive that
\* interleaves two frames' bytes corrupts the receiver's decode."
\*
\* With no per-connection write serialization, peer A's client can begin its request frame and
\* peer A's server can begin its response frame on the SAME pooled connection before the first
\* frame's bytes are complete. Expect FramesNotInterleaved VIOLATED.
\*
\* Serialized stays FALSE so this isolates the (a′) defect: the system does NOT deadlock here.
\* That is the point of the pair — dropping (a′) buys liveness and loses byte integrity, while
\* dropping (a) buys byte integrity and loses liveness. Only the one-frame hold duration gets
\* both, which is the §6.11(a′) claim.
\* Run: make tlc SPEC=Reentry CFG=ReentryFrameBug
