\* NON-VACUITY WITNESS (§5.10, 0.8.1 W7 Knob 3) — `delta` actually decides a verdict.
\*
\* Asserted as an invariant that MUST FAIL. A violation exhibits a reachable state in which two
\* peers sample the SAME evaluation timestamp `t`, declare DIFFERENT skew tolerances, and reach
\* DIFFERENT verdicts on the same chain — the "may permissibly differ at the boundary" case
\* §5.10 (W7 Knob 3) names, shown to be reachable rather than asserted.
\*
\* Why this exists as its own run: adding `delta` to the model widens the state space whether or
\* not it changes anything. Without this witness, a transcription in which `delta` were carried
\* through the state but never reached the temporal comparison would produce the same green
\* result as a correct one — the inert-model failure that docs/PROPERTIES.md §C.4 records and
\* that the whole TLA+ witness slice exists to close.
\*
\* It is also what makes RevokeDeltaBlindBug a control rather than a coincidence: that config's
\* invariant cannot see `delta`, so its violation alone does not name a cause. This one requires
\* delta["A"] # delta["B"] in the violating state.
\*
\* EXPECTED VERDICT: VIOLATION of WitnessDeltaDivergence.
\* Run: make tlc SPEC=Revoke CFG=RevokeDeltaWitness
