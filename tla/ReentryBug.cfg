\* SERIALIZED variant (pre-F-WB28 defect: V7 §6.11(a) VIOLATED — write lock held across
\* send+recv). Expect TLC to report the Class G DEADLOCK (a stuck state with no successor)
\* and/or an EventuallyResolved liveness violation. The counterexample trace IS the goal:
\* "the model finds the bug we found by hand." Run with:  make tlc SPEC=Reentry CFG=ReentryBug
\*
\* Note AtomicFrame stays TRUE: this control isolates the (a) defect. Frames do NOT interleave
\* here — over-holding the lock is byte-safe and deadlock-prone, which is exactly why (a) and
\* (a′) are two separate clauses and need two separate controls.
SPECIFICATION Spec
CONSTANT Serialized = TRUE
CONSTANT AtomicFrame = TRUE
INVARIANT StoreBounded
INVARIANT NoDispatchWithoutGate
INVARIANT FramesNotInterleaved
PROPERTY EventuallyResolved
