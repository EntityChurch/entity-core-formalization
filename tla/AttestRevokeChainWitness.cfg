\* NON-VACUITY WITNESS (PROPERTIES.md §C.4). Asserted in order to be VIOLATED -- the violation
\* is the PASS, a clean run is a build failure.
\*
\* It exhibits a REVOKED REVOCATION: a matching-attester revocation that is itself revoked and
\* therefore dead. Both findings and DeadRevocationSpares are about that configuration; without
\* it they are claims about a state space that does not contain the case.
\*
\* ONE INVARIANT PER WITNESS CFG: TLC stops at the first violation, so a cfg declaring two
\* witnesses asserts one and silently drops the other.
\* Expected verdict: `Invariant WitnessRevokedRevocation is violated.`
SPECIFICATION Spec

CONSTANTS
  N                = 4
  Peers            = {1, 2}
  AuthorityRevoke  = FALSE
  RecursiveMainRev = TRUE

INVARIANTS
  WitnessRevokedRevocation
