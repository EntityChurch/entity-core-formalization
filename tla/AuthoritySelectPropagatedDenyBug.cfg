\* NEGATIVE CONTROL. Same weakening as AuthoritySelectPropagatedBug, OTHER PROPERTY — and the
\* pair is the point. MUST FAIL on OwnBehalfNotSpuriouslyDenied: on a chain no live caller
\* originated, `ctx.caller_capability` holds the arming token (§6.8's measured inbox deliver
\* token), which does not cover the handler's own managed namespace, so row 2's own authorized
\* write is REFUSED. So the propagated reading is not merely insecure — it is both, and no
\* single default fixes it. That is why §6.8 selects per hop.
SPECIFICATION Spec
CONSTANT AuthoritySource = "propagated"
CONSTANT Discriminator = "serves"
CONSTANT Row1Authorities = "both"
CONSTANT PeerRootChecked = FALSE
