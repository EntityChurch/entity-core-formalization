\* §9.4 NEGATIVE CONTROL -- weakens the model on purpose. FailClosed = FALSE removes §9.4's MUST,
\* so a recovery is accepted with no cached quorum-publish at all.
\*
\* §9.4 names this outcome and forbids it in the same breath: "Recovery rotations cannot be
\* accepted on the strength of arbitrary signatures; the contact's prior cached signer set is the
\* trust anchor." Without the rule, an attacker who reaches a contact that never cached anything
\* replaces the identity's handle outright.
\*
\* Expected verdict: `Invariant RecoveryFailClosed is violated.`
SPECIFICATION Spec

CONSTANTS
  SeedEnabled           = TRUE
  SeedValidates         = TRUE
  FailClosed            = FALSE
  AnchorIsCachedPublish = TRUE
  AnchorDroppedOnAccept = FALSE

INVARIANTS
  RecoveryFailClosed
