\* §9.2 vs §4.2 / §4.2a / §5.1 FINDING -- NOT a negative control. AgentPublicAllowed = TRUE is
\* §4.2's per-function valid-modes table AS WRITTEN ("agent: any of the four"), §4.2a's
\* publication-mode table as written, and §5.1's path layout as written. Every other constant is
\* the green sweep's.
\*
\* §9.2 (MUST, restated in §10.1 as a conformance commitment): implementations MUST reject
\* attestations under `system/identity/public/` carrying signatures from any currently-live
\* controller of the trusted quorum. §2.3 fixes an agent cert's signer as the issuing controller
\* in the three-key default, §4.2a puts mode=public at `public/cert/{hash_hex}`, and §11.3 calls
\* the three-key shape the RECOMMENDED default.
\*
\* THE STATE TLC EXHIBITS: `kind = 1` (identity-cert), `func = 2` (agent), `mode = 2` (public),
\* `shape = 1` (three-key). §4.2a's own use case for that cell is "Public-facing infrastructure".
\*
\* The four-key shape is NOT a counterexample -- there the identifier signs agent certs and §9.2
\* is satisfiable. The asymmetry is the tell: §9.2 reads as though written with only that shape
\* in view.
\*
\* Expected verdict: `Invariant PublicPathNeverControllerSigned is violated.`
SPECIFICATION Spec

CONSTANTS
  SignerSetIsSound        = TRUE
  TopologyFirst           = TRUE
  AgentPublicAllowed      = TRUE
  RevocationAdmitted      = TRUE
  RevocationDispatched    = TRUE
  HandoffSignerFromTarget = TRUE
  TargetGuarded           = TRUE
  HandoffIsDualSig        = TRUE
  HandoffIdentityEnforced = TRUE

INVARIANTS
  PublicPathNeverControllerSigned
