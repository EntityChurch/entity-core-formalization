\* §4.3 NEGATIVE CONTROL — LiveTransitive = FALSE.
\* The defect: the pre-ratification reading of the supersession check, in which only DIRECT
\* successors are consulted and the recursion goes through the full predicate. On a three-link
\* chain that makes the OLDEST and the NEWEST both live at once -- the middle link is dead, so
\* the oldest finds no live successor and calls itself current. "Live" then stops meaning
\* "current authoritative version", which is what the transitive amendment was for.
\*
\* AllowCycles = FALSE because the direct reading is a recursion over the graph and is only
\* well defined where the graph is acyclic; the control must fail on the defect, not on an
\* artifact of a truncated recursion.
\*
\* MUST FAIL, and must fail on NoLiveAncestorOfLive -- not on a neighbouring invariant, which
\* is why it is the only one declared.
\* Expected verdict: `Invariant NoLiveAncestorOfLive is violated.`
SPECIFICATION Spec

CONSTANTS
  N              = 3
  AllowCycles    = FALSE
  LiveTransitive = FALSE
  DagFiltersLive = TRUE

INVARIANTS
  NoLiveAncestorOfLive
