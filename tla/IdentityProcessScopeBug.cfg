\* §6.3 NEGATIVE CONTROL -- weakens the model on purpose. Phase2aScoped = FALSE removes §6.3's
\* phase-2a scope rule (normative, per v2.0 PR-8.3), so the fail-closed unbind fires on
\* locally-created attestations too.
\*
\* That is the defect the rule was written against, and §6.3 states its symptom: the caller sees
\* a `200` from `:create_attestation` because the entity was bound at write time, then a phantom
\* `404` on read because the sync hook unbound it before its signatures had been ingested.
\* Surfaced by Go's `acme_14_1_configure_ceremony` Tier 3 fixture.
\*
\* Expected verdict: `Invariant LocalCreateNeverUnbinds is violated.`
SPECIFICATION Spec

CONSTANTS
  PreRouteQPublish       = TRUE
  PreRouteQUpdate        = TRUE
  SeedOnPreRoute         = TRUE
  RevocationAdmitted     = TRUE
  Phase2aScoped          = FALSE
  EmitOnFailure          = TRUE
  EmitOnSuccess          = FALSE
  UnbindOnHandlerFailure = FALSE

INVARIANTS
  LocalCreateNeverUnbinds
