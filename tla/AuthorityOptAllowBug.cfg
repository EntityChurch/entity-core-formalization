\* NEGATIVE CONTROL #1 — §5.2 authority collapsed to Option<Capability>, empty case defaults
\* to ALLOW. The spec's own words: "Defaulting the empty case to allow authorizes every
\* grantless sub-dispatch." Expect NoGrantlessAllow VIOLATED — a sub-dispatch whose parent
\* holds no handler grant reaches "allow" instead of the mandated 403.
\* Note EntryNotSpuriouslyDenied still HOLDS here: that is the trade the collapse makes, and
\* seeing it hold is what shows the two properties are the real constraint pair.
\* Run: make tlc SPEC=Authority CFG=AuthorityOptAllowBug
SPECIFICATION Spec
CONSTANT AuthorityModel = "option-allow"
CONSTANT CheckSubDispatch = TRUE
CONSTANT InheritResource = FALSE
INVARIANT NoGrantlessAllow
