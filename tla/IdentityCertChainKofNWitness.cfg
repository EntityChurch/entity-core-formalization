\* §3.6 NON-VACUITY WITNESS. Asserted in order to be VIOLATED; the violation exhibits the state
\* and IS the pass. A clean run means the state is unreachable and the greens above are
\* statements about a model that never gets interesting.
\*
\* A K-of-N topology is dispatched at all. Without it, TopLevelControllerIsKofN,
\* LifecycleIsQuorumDriven and KofNAnswerIsTrustworthy are statements about a model that never
\* reaches the arm they are about -- and KofNAnswerIsTrustworthy in particular would then be a
\* declared substrate assumption that nothing consumes.
\*
\* Expected verdict: `Invariant WitnessKofNDispatched is violated.`
