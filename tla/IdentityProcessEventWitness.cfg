\* §6.3 NON-VACUITY WITNESS. Asserted in order to be VIOLATED; the violation exhibits the state
\* and IS the pass. A clean run here means the state is unreachable and the greens above are
\* statements about a model that never gets interesting.
\*
\* A phase-2 handler failure produces a phase-3 event. Without this, `NoSuccessEvents` holds
\* vacuously on a model that emits nothing ever.
\*
\* Expected verdict: `Invariant WitnessFailureEvent is violated.`
