\* §6.3 NEGATIVE CONTROL -- weakens the model on purpose. EmitOnSuccess = TRUE emits on the
\* success path.
\*
\* §6.3 phase 3, v2 scope, is a MUST NOT and not merely an omission: "Informational events
\* (success-path observability) are OUT OF SCOPE for v2 ... impls MUST NOT emit success events
\* during v2 to keep the surface predictable." A conformant v2 peer that emitted them would fill
\* the events subtree that §6.3's retention rule forbids pruning for recovery_signal entries.
\*
\* Expected verdict: `Invariant NoSuccessEvents is violated.`
SPECIFICATION Spec

CONSTANTS
  PreRouteQPublish       = TRUE
  PreRouteQUpdate        = TRUE
  SeedOnPreRoute         = TRUE
  RevocationAdmitted     = TRUE
  Phase2aScoped          = TRUE
  EmitOnFailure          = TRUE
  EmitOnSuccess          = TRUE
  UnbindOnHandlerFailure = FALSE

INVARIANTS
  NoSuccessEvents
