\* NEGATIVE CONTROL #2 — the RATIO BOUNDARY. Here TtlSeed = DepthCeiling * MaxFanout exactly
\* (4 x 2 = 8), i.e. the spec's recommended ratio applied at a peer whose worst-case
\* sub-dispatch fan-out equals the ratio. Expect DepthBrakeFirst VIOLATED.
\*
\* This is NOT a claim that the spec's recommended 8x default is wrong. §5.9 states the
\* requirement as a property — the ratio must be "chosen so the deterministic depth brake
\* engages before the TTL backstop UNDER THE PEER'S WORST-CASE SUB-DISPATCH FAN-OUT" — and
\* puts that choice on the deployment. What this control shows is that the property needs
\* ceiling x worst_case_fanout to be STRICTLY LESS THAN the seed: at exact equality the last
\* causal level spends the last of the TTL and the backstop fires on the same step the brake
\* would have. So a deployment that takes the recommended 8x seed AND has a worst-case fan-out
\* of 8 has zero margin. Routed to entity-core-protocol as an observation, not a spec edit
\* (this repo never edits the spec). Run: make tlc SPEC=Bounds CFG=BoundsRatioBug
SPECIFICATION Spec
CONSTANT TtlSeed = 8
CONSTANT DepthCeiling = 4
CONSTANT MaxFanout = 2
CONSTANT MaxCapDepth = 3
CONSTANT DoubleCount = FALSE
CONSTANT ShareReasonCode = FALSE
INVARIANT DepthBrakeFirst
