\* §4.1 NEGATIVE CONTROL. `DedupeByPeer = FALSE` drops the "defensive dedupe" -- `signed`
\* becomes a list of slots rather than a set of candidates -- so one peer holding one key fills
\* as many slots as resolve to it and reaches a threshold it should not.
\*
\* Expected verdict: `Invariant DedupeCountsPeersOnce is violated.`
SPECIFICATION Spec

CONSTANTS
  NS              = 3
  NP              = 3
  CreateValidates = TRUE
  DedupeByPeer    = FALSE
  ResolveChecked  = TRUE

INVARIANTS
  DedupeCountsPeersOnce
