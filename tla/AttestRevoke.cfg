\* §4.3 GREEN — the revocation half of the liveness check, over every supersedes-and-revocation
\* configuration on four nodes.
\*
\* One of these greens is a finding rather than a success: DeadRevocationSpares states a
\* revocation-revival semantics that follows from §4.3's main-path recursion and is documented
\* nowhere, while the supersession-side twin of it IS documented at length.
\*
\* D13 note: this cfg declares INVARIANTs -- `tlc-green` requires at least one, because TLC
\* enumerates the state space, checks nothing and exits 0 on a cfg declaring none.
SPECIFICATION Spec

CONSTANTS
  N                = 4
  Peers            = {1, 2}
  AuthorityRevoke  = FALSE
  RecursiveMainRev = TRUE

INVARIANTS
  TypeOK
  OnlySelfRevocationKills
  DeadRevocationSpares
  NoLiveAncestorOfLive
  DescReadingsCoincide
