\* §4.3/§5.1/§5.2/§5.3 GREEN — the results about the supersedes graph that HOLD, over every
\* attestation graph on three nodes, cyclic configurations included.
\*
\* Two of these greens are findings rather than successes, and are worded that way in the
\* module: HeadResolutionIsIdentity says §5.1's head-resolution step maps every live candidate
\* to itself, and SpecWalkNeverExhausts says §5.3's unbounded loop is bounded by an accident
\* of the predicate it filters on rather than by anything the loop does.
\*
\* D13 note: this cfg declares INVARIANTs -- `tlc-green` requires at least one, because TLC
\* enumerates the state space, checks nothing and exits 0 on a cfg declaring none.
SPECIFICATION Spec

CONSTANTS
  N              = 3
  AllowCycles    = TRUE
  LiveTransitive = TRUE
  DagFiltersLive = TRUE

INVARIANTS
  TypeOK
  DagHeadFindsLiveHead
  DagHeadIsLive
  NoLiveAncestorOfLive
  HeadResolutionIsIdentity
  SpecWalkNeverExhausts
  BackWalkBoundedWhenAcyclic
