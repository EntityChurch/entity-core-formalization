\* §4.9(a)/(c)/(e) LIVENESS slice of the correct peer — expect all-green.
\* NReq = 3 (not 4): TLC's liveness graph exhausts the 2g cap at NReq = 4. The trade is stated
\* rather than hidden — at NReq = 3 only keys "k1" (shared by reqs 1,2) and "k2" are reachable,
\* so the MaxStore = 2 live-key bound is NOT falsifiable in THIS config. It is falsifiable in
\* Store.cfg / StoreRefcountBug.cfg at NReq = 4, which is where that claim is earned. What this
\* config earns is Responsive + Recovers, plus the §4.8 refcount contention on the shared key.
SPECIFICATION Spec
CONSTANT NReq = 3
CONSTANT MaxPending = 2
CONSTANT MaxStore = 2
CONSTANT Serialize = TRUE
CONSTANT Admit = TRUE
CONSTANT SilentDrop = FALSE
CONSTANT SyncRefs = TRUE
INVARIANT StoreRaceFree
INVARIANT NoUseAfterFree
INVARIANT ResourceBounded
INVARIANT CleanReject
PROPERTY Responsive
PROPERTY Recovers
