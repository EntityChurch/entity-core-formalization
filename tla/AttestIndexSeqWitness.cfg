\* NON-VACUITY WITNESS FOR THE SEQUENCING ITSELF (PROPERTIES.md §C.4; the §CORE:6.2 Register
\* lesson, applied before it could bite here rather than after two releases).
\*
\* WitnessIndexPartial says no attestation ever holds a proper non-empty subset of its
\* eligible index entries. It is asserted in order to be VIOLATED: the violation exhibits an
\* `idx` genuinely mid-publish, which is the state the COLLAPSED shape (SequencedIndex = FALSE)
\* cannot reach at all.
\*
\* Why this matters more than it looks: if the publishes were collapsed into one assignment,
\* IndexAllOrNothing would merely restate that assignment and could not fail -- the exact
\* vacuity that sat in Register.tla for two releases with all its teeth on the control side.
\* Run this cfg with SequencedIndex = FALSE and the witness does NOT fire, which is the
\* demonstration rather than the argument.
\* Expected verdict: `Invariant WitnessIndexPartial is violated.`
SPECIFICATION Spec

CONSTANTS
  AtomicIndex    = TRUE
  KindGate       = TRUE
  RetainOnRevoke = TRUE
  SequencedIndex = TRUE

INVARIANTS
  WitnessIndexPartial
