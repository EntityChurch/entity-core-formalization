\* §4.2 / §4.2.1 GREEN — the cache-invalidation contract over every interleaving of the three
\* write paths, walks and cold starts, on three quorum events split across two quorums.
\*
\* WHAT THE GREEN ASSERTS, AND IT IS A CONDITIONAL. `WalkClosedOverValidated = TRUE` is the
\* closure §4.2's cold-start justification claims already holds ("tree-bound only on validation
\* success"). Granted that, §4.2.1's trigger and non-trigger set is EXACTLY SUFFICIENT: the
\* cache never disagrees with the validated state, invalidation fires only on validate-accept,
\* and it never crosses quorum boundaries. The invalidation rules are sound. What is missing is
\* the closure they need, and the finding configs measure that.
\*
\* Note that RawWrites = TRUE here: §8's direct tree:put is ENABLED in the green sweep. Under
\* the closure it is harmless, which is the precise statement -- raw writes are not the defect,
\* raw writes plus an unclosed read path are.
\*
\* D13 note: this cfg declares INVARIANTs -- `tlc-green` requires at least one, because TLC
\* enumerates the state space, checks nothing and exits 0 on a cfg declaring none.
SPECIFICATION Spec

CONSTANTS
  NA                      = 3
  NQ                      = 2
  RawWrites               = TRUE
  AcceptInvalidates       = TRUE
  RawInvalidates          = FALSE
  ScopedInvalidation      = TRUE
  WalkClosedOverValidated = TRUE

INVARIANTS
  TypeOK
  CacheMatchesValidated
  NoInvalidationWithoutAcceptance
  InvalidationScopedPerQuorum
  AcceptLeavesNoStaleEntry
