\* §6.3 GREEN -- and this cfg's constants are NOT a cohort consensus, which is the first thing
\* to know about it. On the quorum track the green sweep could run "what all three
\* implementations do", because all three did the same thing. Here they do not: Go no-ops every
\* non-identity kind and seeds nothing, Rust routes quorum-publish and seeds it unvalidated,
\* Python routes quorum-publish AND quorum-update and validates both, and only Go admits
\* `revocation`. There is no setting that is all three at once.
\*
\* So these constants are the UNION of the three repairs -- what §6.3 would have to say for ANY
\* of the three to be conformant, and which NO implementation currently is. Read every green
\* below as "the arrival path behaves correctly IF §6.3 said this", not as "the cohort behaves
\* correctly". The three finding cfgs run §6.3 and §3.6 exactly as written.
\*
\* The three arrival-path findings (SeedRowReachable, RevocationSurvivesArrival,
\* QuorumUpdateSurvivesArrival) are asserted here TOO, and are green here. That is deliberate:
\* it makes this cfg the statement of what the repair buys, and it means a future weakening of
\* the union shows up as a green-sweep failure rather than as a finding row quietly going stale.
\*
\* D13 note: this cfg declares INVARIANTs -- `tlc-green` requires at least one, because TLC
\* enumerates the state space, checks nothing and exits 0 on a cfg declaring none.
\*
\* VACUITY NOTE, because it bit this exact cfg. Under the union of repairs, kinds 1-5 are all
\* admitted by step 1 and kinds 6-7 are both pre-routed, so the phase-2a unbind path is reached
\* by NOTHING and `LocalCreateNeverUnbinds` / `UnbindOnlyOnRejection` were true of a model that
\* never unbinds. `KForeign` exists to keep that path live and `IdentityProcessUnbindWitness`
\* is what proves it does.
SPECIFICATION Spec

CONSTANTS
  PreRouteQPublish       = TRUE
  PreRouteQUpdate        = TRUE
  SeedOnPreRoute         = TRUE
  RevocationAdmitted     = TRUE
  Phase2aScoped          = TRUE
  EmitOnFailure          = TRUE
  EmitOnSuccess          = FALSE
  UnbindOnHandlerFailure = FALSE

INVARIANTS
  TypeOK
  SeedRowReachable
  RevocationSurvivesArrival
  QuorumUpdateSurvivesArrival
  LocalCreateNeverUnbinds
  UnbindOnlyOnRejection
  FailureIsObservable
  NoSuccessEvents
  ForeignKindNotDispatched
