\* NON-VACUITY WITNESS for the SEQUENCING ITSELF (docs/PROPERTIES.md §C.4, STATUS item 13).
\*
\* `WitnessTreePartial` is, character for character, the PRE-0.8.3 form of
\* `NoPartialResidue`: `\A h : tree[h] \in {{}, FACETS}`. Under the collapsed-write model that
\* invariant could not fail, which is exactly why the Register positive was called
\* near-tautological — it restated the assignment. Under SequencedWrites it MUST fail, because
\* the four non-committing facets now land one per transition and the tree genuinely passes
\* through partial states.
\*
\* So this run is the retirement of that vacuity, stated as a run rather than as a claim about
\* the source text: the old invariant is now false, and the new ones
\* (`RegisterAllOrNothing`, `IndexMatchesTree`) hold anyway — because a discipline makes them
\* hold, not because no other state exists.
\*
\* Why it is needed rather than obvious: a "sequenced" model whose sequence is never reached
\* is the same vacuity wearing different source code. Adding write-loop labels does not prove
\* the loop is entered; only a violated reachability assertion does.
\*
\* EXPECTED VERDICT: VIOLATION of WitnessTreePartial.
