\* GREEN — the clause's own conformance check on our transcription.
\*
\* §5.10 (0.8.1, W7 Knob 3) ends with: "`delta = 0` reproduces today's exact behavior." That is
\* a testable statement about any implementation of the clause, including ours, and this config
\* is it: `DeltaVals = {0}` pins every peer to the default tolerance and re-runs the FULL green
\* invariant set — the same four invariants and the same liveness property as Revoke.cfg.
\*
\* What it catches that Revoke.cfg cannot: a transcription that widened the validity window in
\* a way that does not collapse at delta = 0. Written as
\*   TTLok(p) == NotBefore <= t[p] + delta[p] /\ t[p] <= ExpiresAt + delta[p]
\* the reduction at delta = 0 is `1 <= t[p] /\ t[p] <= 1`, i.e. exactly the pre-0.8.3
\* `t[p] = 1`. Getting a sign wrong, applying the tolerance to only one side of the window, or
\* attaching it to the wrong operand would all still pass Revoke.cfg — which admits delta = 1
\* and therefore expects a wider window — and would fail here.
\*
\* This is the D13 question asked of a GREEN row rather than a control: the green run's
\* criterion is "the invariants hold", and a model with the WRONG window can satisfy it. The
\* backstop is that the spec states an equivalence, so we can run the equivalence.
\*
\* EXPECTED VERDICT: no error — "Model checking completed. No error has been found."
\* Run: make tlc SPEC=Revoke CFG=RevokeDeltaZero
SPECIFICATION Spec
CONSTANT HonorRevocation = TRUE
CONSTANT LeakLayer1 = FALSE
CONSTANT NoConverge = FALSE
CONSTANT PropBound = 2
CONSTANT MaxTick = 4
CONSTANT DeltaVals = {0}
CONSTANT BoundedPropagation = TRUE
INVARIANT RevokedNeverPasses
INVARIANT VerdictFnOfLayer1
INVARIANT VerdictFnOfLayer1_DeltaBlind
INVARIANT BoundHonored
INVARIANT ExposureBounded
PROPERTY RevocationConverges
