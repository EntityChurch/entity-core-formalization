\* §5.2 FINDING — NOT a negative control, same as its sibling: the constants are the green
\* sweep's constants and nothing is weakened. BackWalkBoundedWhenAcyclic is green in that
\* sweep; this is the same claim with the acyclicity assumption removed, and removing an
\* assumption the spec never states is not breaking the model.
\*
\* The violation exhibits a supersedes configuration on which §5.2's `while current.supersedes
\* is not null` -- no depth bound, no visited set -- does not terminate. Whether such a
\* configuration can be BUILT is a question about content-addressing, not about this model;
\* ../docs/LEAN-SEAM.md row O6 is where that question lives and who owns it.
\*
\* The minimal counterexample TLC finds is a node that supersedes ITSELF, which is the
\* cheapest cycle rather than the most persuasive one. It is left as the reported witness
\* deliberately: a self-supersede and a two-node cycle are ruled out by the same argument and
\* by nothing else, so the small witness makes the load-bearing assumption easier to see, not
\* harder. Longer cycles are in the checked domain and violate the same invariant.
\*
\* Expected verdict: `Invariant BackWalkBoundedAlways is violated.`
SPECIFICATION Spec

CONSTANTS
  N              = 3
  AllowCycles    = TRUE
  LiveTransitive = TRUE
  DagFiltersLive = TRUE

INVARIANTS
  BackWalkBoundedAlways
