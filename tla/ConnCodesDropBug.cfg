\* response and no close. The caller learns nothing until its own §6.11(c) deadline expires,
\* and the refusal is unobservable to every instrument."
\* DISTINCT from control #6 by construction: §4.11 says the two "are distinct failures rather
\* than one", so each has its own constant value and its own invariant. A single
\* "conformant/not" boolean could not tell them apart, which is the thing the section says.
\* EXPECTED VERDICT: NoSilentDrop VIOLATED.
\* Run: make tlc SPEC=ConnCodes CFG=ConnCodesDropBug
SPECIFICATION Spec
CONSTANT CollapseCodes = FALSE
CONSTANT WrongStatus = FALSE
CONSTANT SeqReadingBug = FALSE
CONSTANT AuthBeforeAddress = FALSE
CONSTANT RefusalMode = "drop"
CONSTANT EcfOnFraming = FALSE
