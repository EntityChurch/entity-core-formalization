\* §9.4 FINDING -- NOT a negative control, and the constant moves TOWARD an implementation rather
\* than away from the spec, which is the second finding shape tla/Makefile's TLC_FINDING header
\* documents. SeedValidates = FALSE is entity-core-rust: `seed_contact_quorum_publish_cache` runs
\* BEFORE phase 1 and returns ok without validating anything.
\*
\* The finding is not against Rust. §9.4 calls the cached entry "the trust anchor" and neither
\* §9.4 nor §6.3 says one word about what may become one -- there is no validation step to omit,
\* because none is written. Rust's branch is a repair for the gap R1 is about, and the repair
\* had to invent its own admission rule. Python invented a different one. Go invented a third.
\*
\* Expected verdict: `Invariant AnchorWasValidated is violated.`
