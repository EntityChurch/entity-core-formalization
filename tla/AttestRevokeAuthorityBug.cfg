\* §4.3/§4.4 NEGATIVE CONTROL — AuthorityRevoke = TRUE.
\* The defect: the primitive drops §4.3's `rev.attesting == att.attesting` filter, so ANY peer's
\* revocation kills any attestation. That is the consumer's authority rule, which §4.4 says the
\* primitive does not implement -- the primitive provides the lookup and the consumer applies
\* the rule. A substrate that revokes on anyone's say-so is the whole reason that split exists.
\*
\* MUST FAIL, and must fail on OnlySelfRevocationKills.
\* Expected verdict: `Invariant OnlySelfRevocationKills is violated.`
SPECIFICATION Spec

CONSTANTS
  N                = 4
  Peers            = {1, 2}
  AuthorityRevoke  = TRUE
  RecursiveMainRev = TRUE

INVARIANTS
  OnlySelfRevocationKills
