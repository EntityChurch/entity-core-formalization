\* §4.2.1 NEGATIVE CONTROL. `AcceptInvalidates = FALSE` drops triggers 1 and 2 -- a successful
\* local op / validated arrival no longer invalidates. The cache then serves a signer set that
\* predates a membership change it already accepted, which is the failure the trigger exists to
\* prevent.
\*
\* Expected verdict: `Invariant CacheMatchesValidated is violated.`
SPECIFICATION Spec

CONSTANTS
  NA                      = 3
  NQ                      = 2
  RawWrites               = TRUE
  AcceptInvalidates       = FALSE
  RawInvalidates          = FALSE
  ScopedInvalidation      = TRUE
  WalkClosedOverValidated = TRUE

INVARIANTS
  CacheMatchesValidated
