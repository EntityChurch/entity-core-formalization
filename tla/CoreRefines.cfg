\* T4 — INVARIANT IMPLICATION UNDER THE MAPPING (tla/RefMap.tla). Conn's OWN invariant text
\* — reached through INSTANCE, not transcribed — asserted over the composed model's
\* reachable states at every peer.
\*
\* ONE INVARIANT, NOT SEVEN, AND THAT IS THE RESULT. The first draft asserted all seven
\* mapped component invariants and went green. Six of them cannot fail over any Core
\* behaviour (measured: the CoreMapFree* rows), so that green certified one property and six
\* tautologies. See tla/Core.tla §T4 for the full reasoning and for what TLC's own
\* constant-level warning did and did not catch.
\*
\* WHAT THIS ASSERTS (D13): that Core's reachable states satisfy Conn's §4.2 pre-auth
\* invariant under the mapping, at every peer. What else satisfies it? Nothing vacuous —
\* CoreMapFreeCarried.cfg exhibits a type-correct valuation that violates this same formula,
\* so the mapping does not force it.
\*
\* WHAT IT DOES NOT ASSERT: that Core REFINES Conn. It does not — Core performs the two-step
\* §4.6 handshake in a single step, so no mapping satisfies Conn's next-state relation.
\* Invariant implication and refinement are not the same claim; this is the weaker one.
\*
\* EXPECTED VERDICT: no error.
\* Run: make tlc SPEC=Core CFG=CoreRefines
