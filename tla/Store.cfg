\* Add statements after this line.
\* §4.8/4.9/4.10-correct peer — SAFETY slice. Expect all-green.
\* MaxPending < NReq so the admission bound is load-bearing (some load is refused/back-pressured).
\* NReq = 4 over 3 distinct store keys (reqs 1,2 share "k1"): the shared key is the §4.8
\* refcount contention point, and 3 keys against MaxStore = 2 makes the live-key bound
\* falsifiable rather than true-by-construction (the v0.8.0 single-key vacuity, PROPERTIES §C.4).
\*
\* SAFETY ONLY, and deliberately so: TLC's liveness check builds the full behaviour graph and
\* exhausts the 2g cap (caps.mk) at NReq = 4. Liveness runs at NReq = 3 in StoreLive.cfg. This
\* is the same safety/liveness split the Spin re-encoding already makes (-DNOCLAIM vs -a -f);
\* the two configs together cover both, and neither hides behind the other.
SPECIFICATION Spec
CONSTANT NReq = 4
CONSTANT MaxPending = 2
CONSTANT MaxStore = 2
CONSTANT Serialize = TRUE
CONSTANT Admit = TRUE
CONSTANT SilentDrop = FALSE
CONSTANT SyncRefs = TRUE
INVARIANT StoreRaceFree
INVARIANT NoUseAfterFree
INVARIANT ResourceBounded
INVARIANT CleanReject
