\* §4.3 FINDING — NOT a negative control. Every constant here is the green sweep's constant and
\* nothing in the model is weakened. `is_self_revoked` is used by §4.3's
\* has_live_transitive_descendant and DEFINED NOWHERE IN THE DOCUMENT; this asserts that its two
\* natural readings -- the main path's recursive one, and the structural "a matching revocation
\* exists" -- are the same predicate. They are not.
\*
\* The counterexample TLC reports is smaller and sharper than the one this was written for:
\* an EXPIRED revocation. Recursively it is not live, so it does not revoke; structurally it
\* exists, so it does. **Under the structural reading an expired revocation goes on revoking.**
\* A revocation that has itself been REVOKED diverges the same way and is also in the checked
\* domain -- AttestRevokeChainWitness proves that configuration is reached.
\*
\* Expected verdict: `Invariant SelfRevReadingsAgree is violated.`
