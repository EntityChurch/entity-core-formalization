\* NEGATIVE CONTROL (A layer) — establishment gate dropped (GateEstablished = FALSE): client and
\* server dispatch without waiting for the connection to be established. Expect DispatchNeeds
\* Established / ServeNeedsEstablished VIOLATED (dispatch on a conn = "new"). Run: make tlc SPEC=Core CFG=CoreEstabBug
SPECIFICATION Spec
CONSTANT Serialized = FALSE
CONSTANT AtomicFrame = TRUE
CONSTANT GateEstablished = FALSE
CONSTANT GateRevocation = TRUE
INVARIANT FramesNotInterleaved
INVARIANT DispatchNeedsEstablished
INVARIANT ServeNeedsEstablished
INVARIANT NoServeWhenRevoked
PROPERTY EventuallyResolved
