\* §6.3 FINDING -- NOT a negative control. Every constant is §6.3 and §3.6 AS WRITTEN; nothing
\* is weakened. The three pre-route constants are FALSE because the spec has no pre-route
\* branch, and RevocationAdmitted is FALSE because §3.6 says in an explicit comment that it is.
\*
\* §6.3's phase-2 dispatch table declares seven handler rows. Phase 1 runs
\* `identity_verify_cert`, whose step 1 admits four kinds. `(quorum-publish, *) ->
\* seed_contacts_cache` is therefore a row of a normative table that the phase before it makes
\* unreachable -- and on the cross-peer arrival path the entity is UNBOUND on the way past.
\*
\* THE STATE TLC EXHIBITS: `kind = 6` (quorum-publish), any source. Nothing malformed, no
\* attacker, no expiry: an ordinary contact's published quorum state arriving over sync at the
\* path §5.1 gives it, on the hook §10.2 declares.
\*
\* WHY IT MATTERS BEYOND THE UNREACHABLE ROW: `seed_contacts_cache` is what fills
\* `contacts/{published_handle_hex}/quorum-publish`, and §9.4 makes that cache the trust anchor
\* for compromise recovery AND requires fail-closed rejection when it is empty. The consequence
\* is measured in IdentityRecovery, not here.
\*
\* Expected verdict: `Invariant SeedRowReachable is violated.`
SPECIFICATION Spec

CONSTANTS
  PreRouteQPublish       = FALSE
  PreRouteQUpdate        = FALSE
  SeedOnPreRoute         = FALSE
  RevocationAdmitted     = FALSE
  Phase2aScoped          = TRUE
  EmitOnFailure          = TRUE
  EmitOnSuccess          = FALSE
  UnbindOnHandlerFailure = FALSE

INVARIANTS
  SeedRowReachable
