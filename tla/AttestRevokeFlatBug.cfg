\* §4.3 NEGATIVE CONTROL — RecursiveMainRev = FALSE.
\* The defect: the main path stops asking whether the revocation is itself live and treats any
\* matching revocation as killing. This is the STRUCTURAL reading applied to the main path --
\* i.e. the reading the finding configs show is available for the descendant path, applied
\* where the spec text is explicit -- so it also shows what is at stake in leaving the other
\* site undefined: a DEAD revocation goes on killing. The counterexample TLC reports uses an
\* expired revocation; a revoked one does the same.
\*
\* MUST FAIL, and must fail on DeadRevocationSpares.
\* Expected verdict: `Invariant DeadRevocationSpares is violated.`
SPECIFICATION Spec

CONSTANTS
  N                = 4
  Peers            = {1, 2}
  AuthorityRevoke  = FALSE
  RecursiveMainRev = FALSE

INVARIANTS
  DeadRevocationSpares
