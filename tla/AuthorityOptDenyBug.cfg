\* NEGATIVE CONTROL #2 — §5.2 authority collapsed to Option<Capability>, empty case defaults
\* to DENY. The spec's own words: "defaulting it to deny breaks entry dispatch." Expect
\* EntryNotSpuriouslyDenied VIOLATED — a wire-entry EXECUTE whose caller capability covers
\* what it named is refused anyway, because entry and grantless-sub share one spelling.
\* Note NoGrantlessAllow HOLDS here — the mirror image of control #1.
\* Run: make tlc SPEC=Authority CFG=AuthorityOptDenyBug
SPECIFICATION Spec
CONSTANT AuthorityModel = "option-deny"
CONSTANT CheckSubDispatch = TRUE
CONSTANT InheritResource = FALSE
INVARIANT NoGrantlessAllow
INVARIANT EntryNotSpuriouslyDenied
