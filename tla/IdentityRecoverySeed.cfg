\* §6.3 / §9.4 FINDING -- NOT a negative control. SeedEnabled = FALSE is §6.3 AS WRITTEN: phase 1
\* runs identity_verify_cert, whose step 1 rejects kind="quorum-publish", so the phase-2 row
\* `(quorum-publish, *) -> seed_contacts_cache` never runs. Every other constant is the green
\* sweep's.
\*
\* A genuine quorum-publish for the identity arrives at the contact, reaches process_attestation,
\* and the §9.4 cache at `contacts/{old_handle_hex}/quorum-publish` is still empty afterwards.
\* This is IdentityProcess's SeedRowReachable finding stated as a fact about the cache rather
\* than about the dispatch table, and it is the cause of which R2 is the effect.
\*
\* Expected verdict: `Invariant SeedFollowsArrival is violated.`
SPECIFICATION Spec

CONSTANTS
  SeedEnabled           = FALSE
  SeedValidates         = TRUE
  FailClosed            = TRUE
  AnchorIsCachedPublish = TRUE
  AnchorDroppedOnAccept = FALSE

