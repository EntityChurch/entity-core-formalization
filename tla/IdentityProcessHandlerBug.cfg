\* §6.3 NEGATIVE CONTROL -- weakens the model on purpose. UnbindOnHandlerFailure = TRUE lets a
\* phase-2 side-effect failure propagate into an unbind.
\*
\* §6.3 phase 2 forbids exactly this: "handler failure MUST NOT propagate or affect other
\* handlers' execution". The entity stays bound and phase 3's controller-event IS the recovery
\* signal -- §6.3's retention rule calls the event a tombstone for that reason. An unbind here
\* would destroy the validated entity on a recoverable cap-issuance error.
\*
\* Expected verdict: `Invariant UnbindOnlyOnRejection is violated.`
SPECIFICATION Spec

CONSTANTS
  PreRouteQPublish       = TRUE
  PreRouteQUpdate        = TRUE
  SeedOnPreRoute         = TRUE
  RevocationAdmitted     = TRUE
  Phase2aScoped          = TRUE
  EmitOnFailure          = TRUE
  EmitOnSuccess          = FALSE
  UnbindOnHandlerFailure = TRUE

INVARIANTS
  UnbindOnlyOnRejection
