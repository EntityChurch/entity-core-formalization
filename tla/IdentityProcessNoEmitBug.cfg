\* §6.3 NEGATIVE CONTROL -- weakens the model on purpose. EmitOnFailure = FALSE drops phase 3.
\*
\* §6.3 phase 3, v2 scope: "phase 3 MUST emit on phase-2 handler failure". Without it a
\* recovery_signal never reaches the controller and §6.3's retention contract ("the tombstone IS
\* the signal; pruning it loses the signal") has nothing to retain.
\*
\* Expected verdict: `Invariant FailureIsObservable is violated.`
