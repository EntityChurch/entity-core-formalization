\* GREEN — §6.8's authority-selection rule AS WRITTEN at spec-data/v0.8.2.25. Expect all-green.
\* This module carries a MODELING-PIN-OVERRIDE block; the override is declared in TRACKS.toml
\* and gated by `make trackcheck` in both directions. The rule modeled here DOES NOT EXIST at
\* the core pin — see the module header for the 0.8.2.20/.21/.22/.24 sequence that built it.
\*
\* THE JOINT-SATISFIABILITY CHECK, and it is tla/Authority.tla's shape one section over:
\* NoDeputySubstitution (security — row 2) and OwnBehalfNotSpuriouslyDenied (availability)
\* hold TOGETHER here. Both `AuthoritySource` controls hold one and break the other, which is
\* what makes SELECTION PER HOP normative rather than a choice of default.
SPECIFICATION Spec
CONSTANT AuthoritySource = "selected"
CONSTANT Discriminator = "serves"
CONSTANT Row1Authorities = "both"
CONSTANT PeerRootChecked = FALSE
INVARIANT NoDeputySubstitution
INVARIANT CallerFacingNeedsCaller
INVARIANT Row1CeilingHolds
INVARIANT HandlerGrantIsAlwaysCeiling
INVARIANT MisclassificationCostsAvailabilityOnly
INVARIANT NoStaleTokenAuthority
INVARIANT OwnBehalfNotSpuriouslyDenied
INVARIANT PeerRootNeverDenied
