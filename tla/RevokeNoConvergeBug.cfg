\* LIVENESS NEGATIVE CONTROL — revocation non-convergent (NoConverge = TRUE): a peer may finish
\* without ever observing a written marker. Expect RevocationConverges VIOLATED. Safety holds.
\*
\* BoundedPropagation is FALSE here, and must be: a peer that never observes a written marker
\* is by definition not honoring a finite revocation_propagation_bound. Setting both TRUE
\* states a contradiction, and the model reports it as a deadlock rather than a liveness
\* violation — correct behaviour, but not the control this file is for. §5.10 ties the two
\* together: a peer with no honored bound "treats its observed revocation set as empty".
\* Run: make tlc SPEC=Revoke CFG=RevokeNoConvergeBug
SPECIFICATION Spec
CONSTANT HonorRevocation = TRUE
CONSTANT LeakLayer1 = FALSE
CONSTANT NoConverge = TRUE
CONSTANT PropBound = 2
CONSTANT MaxTick = 4
CONSTANT DeltaVals = {0, 1}
CONSTANT BoundedPropagation = FALSE
INVARIANT RevokedNeverPasses
INVARIANT VerdictFnOfLayer1
PROPERTY RevocationConverges
