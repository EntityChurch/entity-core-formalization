\* ⭐ FINDING ROW — NOT A NEGATIVE CONTROL. NOTHING HERE IS WEAKENED AWAY FROM THE SPEC; THE
\* FLIPPED CONSTANT MOVES THE MODEL TOWARD THE SPEC'S OWN ALGORITHM. This is the second shape
\* in tla/Makefile:TLC_FINDING's header, earned on the quorum track.
\*
\* §6.8 row 1 is a `[MUST]` over TWO authorities — "the caller's verified capability (§6.7) —
\* AND the executing handler's own grant as an additional ceiling. Both MUST pass" — and
\* 0.8.2.24 adds "it is never absent". The check that carries it out is
\*
\*     check_path_permission(operation, path, authority, handler_pattern, local_peer_id)
\*
\* which takes ONE `authority`, walks `authority.data.grants`, and returns ALLOW on the first
\* matching entry. A single call cannot express a conjunction over two capabilities, and no
\* sentence in §6.3 or §6.8 says to call it twice. Both of §6.3's worked call sites pass one:
\* `filter_listing` — whose own prose one paragraph above reads "The authority is §6.8 ROW 1 …
\* both MUST pass" — calls it ONCE; and the EXTENSION-SUBSCRIPTION §2.3 call §6.3 quotes
\* APPROVINGLY passes `caller_capability` with no ceiling.
\*
\* So `Row1Authorities = "caller-only"` is that pseudocode, run. MUST FAIL on Row1CeilingHolds.
\*
\* RETIREMENT CONDITION: this row goes green when §6.3 gives the check a way to express the
\* conjunction — a second authority parameter, a stated two-call requirement, or a ceiling
\* argument. When it does, DELETE the row and move the claim into the green sweep. Do not
\* repair the model to make it fail again.
SPECIFICATION Spec
CONSTANT AuthoritySource = "selected"
CONSTANT Discriminator = "serves"
CONSTANT Row1Authorities = "caller-only"
CONSTANT PeerRootChecked = FALSE
INVARIANT Row1CeilingHolds
