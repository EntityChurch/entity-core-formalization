\* §9.4 FINDING -- the security consequence of IdentityRecoveryAnchor, same constants, stated
\* over the outcome instead of over the cache. NOT a negative control.
\*
\* With no admission rule on the anchor, an attacker who can cause a `quorum-publish` naming its
\* own signer set to ARRIVE at the contact -- §ATTEST:8 permits raw `tree:put` to attestation
\* paths (the already-routed Q5) and §5.2's two-tier sync delivers to
\* `system/quorum/{trusts_quorum}/...` -- becomes the trust anchor, and then signs a
\* rotation-recovery that validates against it. The contact's cached handle moves to a key the
\* identity's real quorum never authorized.
\*
\* §9.7 already concedes the case where the attacker holds K of N. This is not that case: the
\* real quorum is intact and signs nothing.
\*
\* NOTE the same invariant is also the target of IdentityRecoveryFreshBug, which is a NEGATIVE
\* CONTROL. Two independent ways to break one property; the distinction lives in these headers,
\* per the TLC_FINDING table's own caveat.
\*
\* Expected verdict: `Invariant AcceptedRecoveryIsQuorumSigned is violated.`
SPECIFICATION Spec

CONSTANTS
  SeedEnabled           = TRUE
  SeedValidates         = FALSE
  FailClosed            = TRUE
  AnchorIsCachedPublish = TRUE
  AnchorDroppedOnAccept = FALSE

INVARIANTS
  AcceptedRecoveryIsQuorumSigned
