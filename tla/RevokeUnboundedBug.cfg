\* NEGATIVE CONTROL #3 (NEW at 0.8.2) — §5.10 revocation-propagation bound absent
\* (BoundedPropagation = FALSE), the gap 0.8.1 W7 Knob 2 closes: "The window between a
\* revocation becoming observable at its authoritative source and a given peer observing it
\* is OTHERWISE UNBOUNDED, so a high-threat operator is *told the window matters*... with no
\* protocol handle to bound it."
\*
\* With no declared/honored bound the peer's sync cadence imposes nothing, so the clock runs
\* past markerAt + B while the marker is still unobserved. Expect BoundHonored VIOLATED and
\* ExposureBounded VIOLATED — a revoked capability keeps passing outside any window anyone can
\* reason about. Such a peer is `supports_revocation`-tier-floor only and, per §5.10, "MUST
\* NOT advertise reason-about-able revocation"; these two invariants are exactly the
\* advertisement it cannot make.
\*
\* Note RevokedNeverPasses still HOLDS: the peer honors every revocation it has OBSERVED. The
\* defect is not incorrect revocation handling, it is an unbounded observation latency — which
\* is why §5.1's property could be green at v0.8.0 while this one had no model at all.
\* Run: make tlc SPEC=Revoke CFG=RevokeUnboundedBug
SPECIFICATION Spec
CONSTANT HonorRevocation = TRUE
CONSTANT LeakLayer1 = FALSE
CONSTANT NoConverge = FALSE
CONSTANT PropBound = 2
CONSTANT MaxTick = 4
CONSTANT DeltaVals = {0, 1}
CONSTANT BoundedPropagation = FALSE
INVARIANT RevokedNeverPasses
INVARIANT BoundHonored
INVARIANT ExposureBounded
