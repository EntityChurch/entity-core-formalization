\* NON-VACUITY WITNESS (PROPERTIES.md §C.4). WitnessThreeChain is asserted in order to be
\* VIOLATED -- the violation is the PASS, a clean run is a build failure.
\*
\* It exhibits the configuration this module turns on: an ACYCLIC three-link chain whose
\* deepest link is live and whose two ancestors are not. Two greens depend on that state being
\* reachable. Without it SpecHeadFindsLiveHead's violation might be coming from a degenerate
\* corner, and BackWalkBoundedWhenAcyclic might be holding over a domain where SupAcyclic is
\* only ever satisfied by graphs with no edges.
\*
\* ONE INVARIANT PER WITNESS CFG: TLC stops at the first violation, so a cfg declaring two
\* witnesses asserts one and silently drops the other.
\* Expected verdict: `Invariant WitnessThreeChain is violated.`
SPECIFICATION Spec

CONSTANTS
  N              = 3
  AllowCycles    = TRUE
  LiveTransitive = TRUE
  DagFiltersLive = TRUE

INVARIANTS
  WitnessThreeChain
