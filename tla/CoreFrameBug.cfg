\* NEGATIVE CONTROL (NEW at 0.8.2) — §6.11(a′) frame-write atomicity dropped under FULL
\* COMPOSITION (AtomicFrame = FALSE). The standalone control is ReentryFrameBug.cfg; this one
\* asks the question that motivated carrying (a′) here at all: does the composed model — which
\* has §5.1 revocation and the §4.2 connection lifecycle that Reentry lacks — reach the
\* interleaving through paths Reentry structurally cannot?
\* Expect FramesNotInterleaved VIOLATED. Serialized stays FALSE so this isolates the (a′)
\* defect and the system does not deadlock.
\* Run: make tlc SPEC=Core CFG=CoreFrameBug
SPECIFICATION Spec
CONSTANT N = 2
CONSTANT Serialized = FALSE
CONSTANT AtomicFrame = FALSE
CONSTANT GateEstablished = TRUE
CONSTANT GateRevocation = TRUE
INVARIANT FramesNotInterleaved
INVARIANT DispatchNeedsEstablished
INVARIANT ServeNeedsEstablished
INVARIANT NoServeWhenRevoked
