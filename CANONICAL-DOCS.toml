[project]
name   = "Entity Core Formalization"
slug   = "entity-core-formalization"
repo   = "entity-core-formalization"
github = "https://github.com/EntityChurch/entity-core-formalization"
intro  = """
Formal design assurance for the Entity Core Protocol. This repo machine-checks
MODELS of the protocol design on the two layers the Lean proof work structurally
cannot reach: distributed correctness + liveness under concurrency (TLA+, cross-
checked by an independent Spin re-encoding and unbounded Apalache SMT proofs), and
active-attacker protocol security (Tamarin + ProVerif, Dolev-Yao). It is a sibling
to entity-core-protocol (the spec authority — it publishes the three specs this
repo models), entity-core-keystone (peers + the Lean logic proof), and the
reference implementations — it verifies the DESIGN, not the code and not any
generated peer.

The repo carries FOUR PROOF TRACKS, declared in TRACKS.toml and gated by `make
trackcheck`: core (the Entity Core Protocol), attestation, quorum and identity.
All four are MODELED, each against its own frozen, separately pinned spec
snapshot. Unless a statement names a track it is about core, which is where all
but nine of the modules live. There is deliberately no repo-wide coverage number and no single
headline result: averaging a heavily verified protocol with a one-module-old one
produces a figure true of neither. Coverage, run counts and spec pins are all
reported per track.

Honesty first (this is design assurance, off the release critical path): it is a
strong DEMONSTRATOR, not a closed proof, and NOT a claim that "the protocol is
proven correct." What is PROVEN unbounded vs only MODELED at a bound vs symbolic is
stated exactly in docs/PROPERTIES.md; the deepest assumption — spec↔model fidelity,
which no tool here closes — is named, not hidden. Which spec version each result is
about is a property of the SHA pin in spec-data/, never of prose: the models are
pinned at spec 0.8.2 while the live spec is 0.8.2.32, and `make specdrift` reports
**15 of 29 cited sections moved** — every result here is a statement about 0.8.2, and
docs/SPEC-DRIFT-ASSESSMENT.md measures what the distance costs, section by section.
Build is make + podman only (no native model-checker
toolchain on the host): `make build` then `make matrix` on a fresh clone runs the
whole gate — every property, every negative control, and a non-vacuity witness per
module — with per-container resource caps so a runaway check dies at the cap instead
of taking the host down.
"""

# ── What each directory IS ──────────────────────────────────────────────────
# Declared because the default rules cannot know a repo's layout, and a check that is
# wrong about a correctly-organised tree is worse than no check. Each area states its
# KIND and whether it publishes; nothing else about it is inferred.

[[area]]
path      = "docs/status"
kind      = "status"        # dated, episodic, ages out. Written for the next session.
publishes = false

[[area]]
path      = "docs/outbox"
kind      = "outbox"        # routing packets we have SENT. Never published — publishing
publishes = false           # the routing corpus is the expensive mistake.

[[area]]
path      = "docs/archive"
kind      = "archive"       # dated BY DESIGN; does not age out. `docs/archive/outbox/`
publishes = false           # holds packets whose recipients have acknowledged them.

[[area]]
path      = "docs/agents/memory"
kind      = "memory"        # durable, indexed, entered through INDEX.md. Published: it
publishes = true            # is the hard-won context a reader of the models wants.

[[area]]
path      = "spec-data"
kind      = "vendor"        # frozen, SHA-pinned spec snapshots. Not prose, never edited
publishes = true            # in place, and the thing every published result is about.

# Durable files that are edited in place rather than dated — and, where `internal`,
# must never publish. A tracker is durable AND internal; before this declaration existed
# the only way to stop the nag was to declare it canonical, which publishes it.
[[living]]
glob     = "docs/status/TRACKER-*.md"
internal = true

[[living]]
path     = "docs/status/FINDINGS-INDEX.md"
internal = true

[[living]]
path     = "docs/status/CONFORMANCE-DIVERGENCE-REGISTER.md"
internal = true

[[living]]
path     = "docs/status/INBOUND.md"
internal = true

# Durable, internal, and it lives HERE rather than in `docs/agents/memory/` because that
# directory publishes as a whole. It is not about the models at all: it is about how a
# finding reaches another repository — their trees, their registers, who owed whom what —
# every line of it addressed to somebody inside this ecosystem, and not one reference in it
# followable from outside. `[[living]] internal = true` inside a publishing `[[area]]` does
# NOT keep a file back; the area's keep-list wins. Moving it was the fix, not re-declaring it.
[[living]]
path     = "docs/status/COUNTERPARTS-AND-ROUTING.md"
internal = true

[[living]]
path = "docs/STATUS.md"

