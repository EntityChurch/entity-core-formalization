title = "Coverage matrix — what is verified, by which tool, and how far it reaches"
blurb = "What each of the four engines can and cannot do; protocol section x engine; what is NOT covered, split into out-of-scope / tool-limited / backlog; the exact bound on every claim."
group = "Assurance"

[[doc]]
path  = "docs/CORROBORATION.md"
title = "Corroboration ledger — how many engines carry each claim"
blurb = "Per modeled subject: which engines have a GREEN result on it, and — named individually, with reasons — every subject that rests on only one. Answers the question the coverage matrix does not: how many independent engines would have to be wrong at once for a published result to be wrong. Derived from the gate tables and checked by `make enginecount`; states in the file what two engines do NOT buy."
group = "Assurance"

[[doc]]
path  = "docs/PROPERTIES.md"
title = "Properties — PROVEN vs MODELED"
blurb = "The honest scorecard: per property, the strength of result (unbounded proof vs bounded-exhaustive vs symbolic) and where it stops."
group = "Assurance"

[[doc]]
path  = "docs/SPEC-DRIFT-ASSESSMENT.md"
title = "Spec-drift assessment — the pin vs the live spec"
blurb = "How far the pinned spec snapshot has aged behind the live protocol, by what method, with the detector's negative controls and stated limits. Reproduce with `make specdrift`."
group = "Assurance"

[[doc]]
path  = "docs/LEAN-SEAM.md"
title = "The assumption ledger — what the models take on faith, and who discharges it"
blurb = "Per abstraction in the models: the proposition relied on, and what discharges it — the Lean authority proof in the keystone peer, another engine here, or nothing. Turns the division of labour between tools from prose into a checkable artifact. Two gates: `make leanseam` (has the cited text moved?) and `make leanproof` (do the cited proofs still hold?)."
group = "Assurance"

[[doc]]
path  = "lean/README.md"
title = "Lean seam tier — checking the proofs the models lean on"
blurb = "The gate that builds the keystone peer's Lean proof track and grades its axiom sets. Why exit status is not the check: a `sorry` is a warning in Lean and lake exits 0. Holds no Lean source — the peer's tree is read-only input."
group = "Assurance"

[[doc]]
path  = "docs/ASSURANCE-MAP.md"
title = "Assurance Map & the limits walls"
blurb = "The complete formal-assurance map and the trust boundaries — above all the 5th wall (spec↔model fidelity)."
group = "Assurance"

[[doc]]
path  = "docs/CROSSCHECK-RESULTS.md"
