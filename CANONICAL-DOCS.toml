# ── Memory ──────────────────────────────────────────────────────────────────
# Durable, topic-scoped notes, entered through INDEX.md and opened by symptom rather
# than read through. Published deliberately: a reader who wants to trust a model needs
# the failures that produced its shape, and those do not fit in a results table.
[[doc]]
path  = "docs/agents/memory/INDEX.md"
title = "Memory index"
blurb = "The entry point. One line per file naming the symptom that should bring you to it, and the rule that bounds the directory: an entry that could become a check should become one, and is then deleted from here."
group = "Memory"

[[doc]]
path  = "docs/agents/memory/MODEL-CONVENTIONS.md"
title = "Model conventions — citations, globs, and the track registry"
blurb = "Why a bare §N.M means your own track's spec, why the cross-track sigil comes first, and why moving model files into a subdirectory could hide them from two gates that stayed green. Each rule is a gate that once asserted less than it said."
group = "Memory"

[[doc]]
path  = "docs/agents/memory/APALACHE-ENCODING.md"
title = "Apalache encoding — what the SMT backend will and will not take"
blurb = "No RECURSIVE, so fuel-bounded recursion becomes a ladder — and every ladder depth is then a claim. Build the ladder from state variables, not nested operators. Learned by OOM-killing the 2 GB cap, not by reading documentation."
group = "Memory"

[[doc]]
path  = "docs/agents/memory/TOOLCHAIN-AND-CONTAINERS.md"
title = "Toolchain and containers — the failures that read like model failures"
blurb = "The bind-mount relabel flag, the resource caps, the pinned rewriting backend, and the non-terminating theory that is excluded by design. Every entry is a tool failure that presents as a model failure."
group = "Memory"

[[doc]]
path  = "docs/agents/memory/EXTENSION-TRACKS.md"
title = "Extension tracks — attestation, quorum, identity"
blurb = "Per track: what was modeled, what it refuted, and what the cross-implementation census said. Includes the cases where the cohort agreed with the text and the text was wrong, and the case where three implementations disagreed with each other."
group = "Memory"

[[doc]]
path  = "docs/agents/memory/SPEC-PIN-AND-DRIFT.md"
title = "The spec pin, and what the distance from it costs"
blurb = "Section by section: what moved, whether it contradicts a model, and why 'the section did not move' and 'the sentence we model did not move' are different claims. Also which repo owns which spec, and the retracted answer to that question."
group = "Memory"

[[doc]]
path  = "docs/agents/memory/GATES-AND-DERIVED-NUMBERS.md"
title = "Gates, and the numbers they do and do not read"
blurb = "The individual published sentences that went stale with every gate green, and the mechanism in each case — an unread facet, a paraphrase, a denominator that was ours. The record behind D15 and D20."
group = "Memory"

[[doc]]
