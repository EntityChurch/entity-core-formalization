# ── Assurance & honest scope ────────────────────────────────────────────────
[[doc]]
path  = "docs/FINAL-ASSURANCE-SUMMARY.md"
title = "Final Assurance Summary (capstone)"
blurb = "What was proved, how far it goes, what it deliberately does not say; the 687-run re-verification matrix."
