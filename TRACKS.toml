note = """
Built on both of the above: certs, rotation by handoff (dual-sig), rotation by recovery
(K-of-N, old key compromised — so the adversary is assumed to hold the old key), retirement.
Deliberately LAST: 1,617 lines, and it consumes the other two. Promoted scoped -> modeled on
2026-09-07 by writing spec-data/MODELING-PIN-IDENTITY, which is the step the `scoped` gate
exists to force — the second time it has forced it, on a different day, without anyone having
to remember. WITH THIS PROMOTION NO SCOPED TRACK REMAINS, so that gate now has no subject in
the live registry and is teeth-tested only by tools/trackcheck.py's own test path. A gate whose
input set has gone empty asserts nothing; recorded here rather than discovered later.

THE TWO PRE-MODEL QUESTIONS THIS NOTE CARRIED ARE BOTH ANSWERED, AND ONE OF THEM PRODUCED THE
TRACK'S HEADLINE. They are left below unrewritten, as the quorum note's were, because what a
pre-model hypothesis got right and wrong is the thing worth reading later (LEAN-SEAM O6).

  (1) "The cross-peer recovery rule is a NEGATIVE REACHABILITY claim ('fail-closed if no
      quorum-publish is cached'), which is the highest vacuity risk there is — a peer that does
      nothing satisfies it. Write the witness before the prohibition." -- RIGHT, followed
      literally, and UNDER-SPECIFIC in a way that turned out to matter. The risk it named was a
      MODEL with no paths. What tla/IdentityRecovery.tla found is a SPEC with no paths: §6.3
      phase 1 rejects `quorum-publish` at `not_identity_attestation`, so §6.3's own phase-2 row
      `(quorum-publish, *) -> seed_contacts_cache` never runs, so §9.4's trust anchor is never
      stored, so §9.4 fail-closes on every cross-peer compromise recovery. `RecoveryFailClosed`
      is GREEN and `RecoveryAttainable` is VIOLATED, on the same constants. Findings I1/R1/R2.
  (2) "Identity's chain-walk predicates (identity_confers_function,
      identity_is_authorized_revoker) are authority-logic interior — the layer
      entity-core-keystone's Lean owns for core. Whether it owns these too is the first Class-L
      question and should be asked BEFORE a model reduces them to a predicate, not after."
      -- ASKED BEFORE, and the answer is NO with a reason worth keeping: keystone's Lean owns
      CAPABILITY-CHAIN attenuation, and §2.2/§12.3 of this spec make identity attestations a
      structurally distinct validation class from capability tokens with "no shared validator".
      Reducing identity's predicates to the Lean layer would be the exact conflation §9.1 calls
      "the natural implementation mistake". So these stay TLA+ operators, LEAN-SEAM O17 records
      that nothing discharges them, and the ledger's Class-L does not grow.

A THIRD QUESTION AROSE FROM THE QUORUM TRACK AND IS ANSWERED IN THE MODELS RATHER THAN HERE.
"Identity consumes current_signer_set, and seven of its inputs are now known-defective — decide
up front whether the identity models transcribe §QUORUM:4.2 as written (and inherit the defects)
or assume the cohort's behaviour (and book it as a Class-O row), because the two answer
different questions and the choice is invisible afterwards." Neither: the assumption is a
CONSTANT (`SignerSetIsSound` in IdentityCertChain), TRUE in the green sweep and FALSE in a
negative control whose whole job is to exhibit what identity's greens rest on. The choice is
therefore visible in the gate table rather than invisible afterwards, and Q1 is not re-routed
wearing an identity section number. LEAN-SEAM O16.

SECOND ENGINE, 2026-09-08 — ONE of three modules. tla/IdentityCertChainApalache.tla carries
§3.6 topology dispatch and §9.2 confinement to Apalache, chosen first because it is where every
K-of-N verdict in this extension is dispatched and the other two modules lean on it.

SECOND ENGINE ON THE HEADLINE MODULE, 2026-09-09 — tla/IdentityRecoveryApalache.tla, and it is
the third consecutive time a lifted domain restriction has found what the first engine could
not. The restrictions were not in `IdentityRecovery.tla`'s `Init` (D15's tenth shape walked
every extension model's `Init` and correctly recorded this module as "a concrete start state"):
they are the KEYLESS CACHE, the handle that never moves, and `MaxDeliveries == 2`. §5.1 writes
the §9.4 trust anchor at `contacts/{published_handle_hex}/quorum-publish` and §9.4 reads it at
`contacts/{old_handle_hex}/quorum-publish`, so a model with one slot assumes the two handles
are the same one. Two new findings, both measured: a §13.3 ROUTINE privacy rotation moves the
handle §9.4 will look up and nothing re-keys or re-publishes the anchor (N1), and §6.3's
`update_handle_cache_to` is named in a normative dispatch table, defined in no section, and its
two readings each satisfy ONE of two properties the spec states while neither satisfies both
(N2) — with the cohort split three ways across exactly that gap.

SECOND ENGINE ON THE LAST MODULE, THE SAME DAY — tla/IdentityProcessApalache.tla, and the FOURTH
consecutive time. The restriction here was neither in `Init` nor in a variable's shape: it was
the model's SHAPE. `IdentityProcess.tla` has three variables and `Next == UNCHANGED vars`, so it
is ONE ARRIVAL. §6.3's arrival path is a loop — phase 2's handlers and phase 2a's unbind WRITE
the tree that §3.6 steps 2 and 3 later READ — and one arrival cannot represent either half of it.
Every ported claim reproduces; two findings do not exist in the old domain. N3: an arriving
`revocation` is unbound by phase 2a (I2) and §3.6 step 3 looks revocations up in the tree, so the
cert it names is admitted on EVERY later arrival — and section 6.4 prices that exposure against a
bound ("the window's bound is the convergence latency") its own arrival path removes. N4: phase 2
dispatches on (kind, function) consulting no state, so a re-arriving cert re-issues the cap an
`identity-retirement` removed; §4.5 says nothing about liveness and §ATTEST:4.3's liveness is
supersedes plus revocation, so phase 1 readmits it. N4 is violated under the UNION of all three
implementations' repairs, so no cohort workaround touches it. Both repairs for each are measured
green. LEAN-SEAM O22 closed — ASSUMPTION FALSE.

So all three modules carry two engines and no Spin encoding and NO PROVER exist on this track
(LEAN-SEAM O19). Do not read "no single-engine module" as corroboration: both engines are
checkers over the same transcription by the same author, and what the last two ports bought was
findings from a lifted DOMAIN, not a second opinion on a question already asked.

Seven findings routed: docs/status/ROUTING-2026-09-07-IDENTITY.md. Two of them are CROSS-SPEC
and one of those exists only in a PAIR of documents — §ATTEST:TV-A8 delegates the rejection of
an invalid-signature revocation to "identity's `identity_verify_cert` ... at topology-dispatch
step", and §3.6 rejects every `kind="revocation"` before topology dispatch is reached. Neither
document is wrong read alone. No Spin anywhere; no prover, so LEAN-SEAM O19's gap is untouched
on every module, second engine or not.

THE COHORT ON THIS TRACK DOES NOT AGREE WITH ITSELF, which is new. On quorum, three independent
authors derived the same unwritten rule three times and that unanimity was the argument for
writing it down. Here all three added a pre-phase-1 kind branch §6.3 does not have and NO TWO
DID THE SAME THING: Go no-ops every non-identity kind and seeds nothing, Rust seeds
quorum-publish without validating it, Python validates and seeds quorum-publish and
quorum-update both, and only Go admits `revocation`. Whether an arriving quorum-publish fills
the §9.4 trust anchor is answered three ways, so the peers do not interoperate on compromise
recovery. "The impls work around it" is not a general law here and this is the sharpest
counter-example on record.

"Recovery cluster" is the pre-v3.3 name for an identity quorum (SYSTEM-IDENTITY-COMPOSITION §7).
"""

