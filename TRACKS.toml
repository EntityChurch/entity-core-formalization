# TRACKS.toml — the proof tracks in this repository, and which files belong to each.
#
# WHY THIS FILE EXISTS
# --------------------
# Until 2026-09-06 this repo had exactly one subject — the Entity Core Protocol — and every
# artifact said so implicitly. Nothing had to declare it, because nothing else was here.
# Extension protocols (attestation, quorum, identity) are the next phase, and they arrive
# with their own spec bodies, their own section numbering and their own owner repo. That
# turns an assumption into a claim, and a claim needs a home and a gate.
#
# THE FAILURE THIS PREVENTS, stated concretely because it is not hypothetical.
# `tools/coverage-check.py` derives the published coverage number from the `§`-citations the
# models carry, using the pattern `§(\d+\.\d+)`. That pattern is DOCUMENT-BLIND: it yields the
# token `5.7` for `EXTENSION-ATTESTATION §5.7` (the index invariants) exactly as it does for
# core `§5.7` (delegation caveats). The core grid already has a `5.7` row, so on the day an
# attestation model lands, its citation is absorbed into a core coverage claim and the gate
# reports OK. That is a phantom row arriving THROUGH the gate whose entire purpose is to
# prevent phantom rows — the §4.7 / §6.9 failure again, one spec body over.
#
# The second half is worse and quieter: `coverage-check.py` and `spec-drift.py` both glob
# `tla/*.tla` etc. NON-RECURSIVELY. Moving models into `tla/attestation/` — the obvious first
# reorganization — makes them invisible to both gates, which then stay green while asserting
# nothing at all about the new track. So the track dimension is declared and gated HERE,
# before any model is written or any file moves. Physical subdirectories are a later and,
# once `make trackcheck` exists, a checkable step.
#
# WHAT READS THIS
#   tools/trackcheck.py     (`make trackcheck`)  — membership, both directions
#   tools/coverage-check.py (`make coverage`)    — per-track citations, grid and denominator
#   tools/spec-drift.py     (`make specdrift`)   — per-track pin and citation set
#
# WHAT THIS FILE DOES *NOT* ASSERT — stated here rather than left to be assumed. That a file
# is on the RIGHT track. Membership is declared by a human and gated only for existence and
# uniqueness; a core model listed under `attestation` passes every check in `trackcheck`.
# Same standing caveat as docs/LEAN-SEAM.md's: the tool detects drift, not error.

[registry]
version = 1

# Discovery: which files are model files at all. `trackcheck` walks the repo for these
# extensions and requires every hit to belong to exactly one track below.
model_extensions = [".tla", ".pml", ".pv", ".spthy"]
model_roots      = ["tla", "spin", "tamarin"]

# Generated artifacts that carry a model extension but are not models. Declared HERE rather
# than hardcoded in the tool so the exclusion is visible to a reader: an exclusion buried in
# code is how a real model file goes uncounted and nobody can see that it did.
# `_apalache-out/` is Apalache's counterexample dump; `*_TTrace_*` is TLC's error-trace spec.
# Both are gitignored, and `trackcheck` cross-checks against git for exactly that reason.
exclude_globs = ["**/_apalache-out/**", "**/*_TTrace_*"]

# ── The citation convention ─────────────────────────────────────────────────────────────
# A bare `§N.M` in a model file means "section N.M of MY OWN track's primary_spec". It never
# means another track's spec. To cite ACROSS tracks, write the sigil, the target track's
# `cite_prefix`, a colon, then the section: an attestation model referring to the core
# register lifecycle writes **`§CORE:6.2`**.
#
# Bare citations are the overwhelming majority and stay bare, so no existing model file
# changes. A cross-track reference is EXCLUDED from every track's coverage set — it is a
# reference, not a claim that the section is verified here, which is the same disposition
# COVERAGE-MATRIX §3b already gives "a cross-reference to another DOCUMENT's section".
# An unprefixed `§6.2` in an attestation model is therefore not a cross-reference: it is a
# claim about EXTENSION-ATTESTATION §6.2, and if no such section exists the gate says so.
#
# THE SIGIL COMES FIRST, AND THAT IS A BUG FIX. The first draft of this notation was
# `CORE §6.2` — prefix, space, sigil. Running the gate produced **23 false hits across 12
# model files**, because prose puts capitalized words before citations constantly
# (`WHAT §6.9 SAYS`, `LIVENESS §4.1`, `THE §5.8`) as do Spin's `-D` macro names
# (`DSERIALIZED §6.11`) — and each false hit was then *excluded* from that line's citation
# set, so the tripwire built to stop citations being miscredited was silently DROPPING them.
# The count survived at 28 only because every affected section is cited on some other line
# too. `§X:N.M` cannot collide: a bare citation is `§`+digit, and this repo's intra-document
# forms are `§C.4`/`§D` — a dot or nothing, never a colon.
#
# The rule that makes this work is the one already in AGENTS.md, unchanged: cite a section
# only where you make a claim about it. A section deliberately NOT modeled is named in prose
# without the `§` sigil.

# ════════════════════════════════════════════════════════════════════════════════════════
# CORE — the Entity Core Protocol. Everything in this repo today.
# ════════════════════════════════════════════════════════════════════════════════════════
[track.core]
kind         = "protocol"
status       = "modeled"
title        = "Entity Core Protocol"
owner_repo   = "entity-core-protocol"
cite_prefix  = "CORE"

# The pin is NOT restated here. `spec-data/MODELING-PIN` is its one canonical home and its
# meaning is unchanged by this file: it names the snapshot the core models transcribe, and
# every published core result is a statement about it. One canonical home per fact.
pin_file     = "spec-data/MODELING-PIN"

# The denominator of core's coverage claim is counted from this file's numbered `§N.M`
# headings, inside whatever snapshot pin_file names.
primary_spec = "ENTITY-CORE-PROTOCOL.md"
specs        = [
  "ENTITY-CORE-PROTOCOL.md",
  "ENTITY-CBOR-ENCODING.md",
  "ENTITY-NATIVE-TYPE-SYSTEM.md",
]

# Where core's coverage claim is published. `coverage-check` reads the grid under this
# heading; a track with no grid section fails rather than being skipped.
coverage_doc     = "docs/COVERAGE-MATRIX.md"
coverage_heading = "Matrix A — protocol section × property class × engine"

