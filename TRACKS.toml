# ════════════════════════════════════════════════════════════════════════════════════════
# EXTENSION TRACKS — declared, not yet modeled.
#
# `status = "scoped"` is a real state with a gated meaning, not a placeholder: a scoped track
# MUST carry no models and no pin. The moment a model file is assigned to one of these,
# `trackcheck` fails until the track is promoted to "modeled" WITH a pin — which is the point.
# Promotion is the step where someone has to say out loud which snapshot the results are about,
# and it cannot be skipped by quietly adding a file.
#
# All three specs are LANDED and readable today in
# `../entity-system-architecture/specs/extensions/` (26 extension specs live there; the three
# below are the scoped phase). Nothing here is blocked on anyone writing anything — nothing is
# vendored yet only because `spec-data/` is held at the core pin until the keystone sibling
# converges, and the extension snapshots ride along with that same re-vendoring pass.
#
# Scoping and the ranked targets: docs/status/SCOPING-2026-09-06-IDENTITY-ATTESTATION.md.
# Start at attestation's substrate, not identity's 1,617 lines.
# ════════════════════════════════════════════════════════════════════════════════════════

[track.attestation]
kind         = "protocol"
status       = "scoped"
title        = "Attestation extension — the signed-edge substrate"
owner_repo   = "entity-system-architecture"
cite_prefix  = "ATTEST"
pin_file     = ""
primary_spec = "EXTENSION-ATTESTATION.md"
specs        = ["EXTENSION-ATTESTATION.md"]
coverage_doc = ""
coverage_heading = ""
models       = []
note = """
The substrate the other two consume: a system/attestation is a signed edge attesting→attested
with a properties.kind, plus a supersedes chain. Owns four mandatory indexes and the
chain-walk family. First target because every identity property is stated in terms of it, and
because two of its shapes reuse models this repo already trusts: index invariant I2
("partial-index states are NOT permitted") is RegisterAllOrNothing with four indexes instead
of five facets, and the chain walks are DeepChain/Bounds' termination question.
"""

[track.quorum]
kind         = "protocol"
status       = "scoped"
title        = "Quorum extension — K-of-N signer rosters"
owner_repo   = "entity-system-architecture"
cite_prefix  = "QUORUM"
pin_file     = ""
primary_spec = "EXTENSION-QUORUM.md"
specs        = ["EXTENSION-QUORUM.md"]
coverage_doc = ""
coverage_heading = ""
models       = []
note = """
A system/quorum is a signer roster + threshold whose own membership changes are attestations
(quorum-update, quorum-publish). Carries the sharpest attacker question on the surface: a
quorum-update is validated at ARRIVAL and then trusted on every read — end-to-end
re-validation "NOT performed and NOT required", cold start "trusts the existing tree state".
So the whole live signer set rests on every write path running arrival-time validation, and
nothing states that every path does. That is an unstated closure assumption and belongs in
docs/LEAN-SEAM.md the day a model exists, whatever the answer turns out to be.
Also carries current_signer_set(as_of) — verdict determinism over a declared temporal input,
which is the exact shape where §5.10's δ turned out to be missing from Revoke.tla and the
invariant was accidentally true. Model not_before and the clock explicitly from the start.
"""

[track.identity]
kind         = "protocol"
status       = "scoped"
title        = "Identity extension — cert chains, rotation, recovery"
owner_repo   = "entity-system-architecture"
cite_prefix  = "IDENT"
pin_file     = ""
primary_spec = "EXTENSION-IDENTITY.md"
specs        = ["EXTENSION-IDENTITY.md"]
coverage_doc = ""
coverage_heading = ""
models       = []
note = """
Built on both of the above: certs, rotation by handoff (dual-sig), rotation by recovery
(K-of-N, old key compromised — so the adversary is assumed to hold the old key), retirement.
Deliberately LAST: 1,617 lines, and it consumes the other two.
Two things to settle before a model abstracts anything away. (1) The cross-peer recovery rule
is a NEGATIVE REACHABILITY claim ("fail-closed if no quorum-publish is cached"), which is the
highest vacuity risk there is — a peer that does nothing satisfies it. Write the witness
before the prohibition; this is the same advice this repo routed to keystone about H3.
(2) Identity's chain-walk predicates (identity_confers_function,
identity_is_authorized_revoker) are authority-logic interior — the layer entity-core-keystone's
Lean owns for core. Whether it owns these too is the first Class-L question and should be
asked BEFORE a model reduces them to a predicate, not after.
"Recovery cluster" is the pre-v3.3 name for an identity quorum (SYSTEM-IDENTITY-COMPOSITION §7).
"""

# ════════════════════════════════════════════════════════════════════════════════════════
# NOT A PROTOCOL TRACK — toolchain smoke files. They model no protocol and make no §-claim;
# they exist to prove a containerized engine runs at all (`make smoke`). Declared explicitly
# so they are accounted for rather than silently excluded, and given kind = "toolchain" so
# `coverage-check` skips them by declaration instead of by their happening to cite nothing.
# ════════════════════════════════════════════════════════════════════════════════════════
[track.toolchain]
kind         = "toolchain"
status       = "n/a"
title        = "Toolchain smoke models"
owner_repo   = ""
cite_prefix  = ""
pin_file     = ""
primary_spec = ""
specs        = []
coverage_doc = ""
coverage_heading = ""
models = [
  "spin/smoke.pml",
  "tla/SmokeApalache.tla",
]
