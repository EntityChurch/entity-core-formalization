# ── PER-MODEL PIN OVERRIDES ─────────────────────────────────────────────────────────────
# A model that transcribes a DIFFERENT snapshot than this track's `pin_file`. Gated by
# `make trackcheck` §E in BOTH directions: the file must carry a matching
# `MODELING-PIN-OVERRIDE:` marker, and a marker with no row here FAILS. `spec-drift` measures
# these files against their own snapshot; `coverage-check` holds their citations OUT of the
# pin's coverage pair and requires them in the `offpin_heading` grid instead.
#
# WHY THE MECHANISM EXISTS AT ALL. `spec-data/MODELING-PIN` says every published result is a
# statement about that snapshot "and no other". Modelling §4.11 — a section that does not
# exist at `v0.8.2` — makes that sentence false the moment the file lands. The obvious remedy
# is a paragraph in the module header saying which snapshot it targets, and AGENTS.md D15's
# eleventh shape is exactly that a disclaimer is not a gate: a self-aware caveat is where a
# stale figure survives longest, because it reads as a site someone has already thought about.
#
# ⛔ AND THE COST IS VISIBLE RATHER THAN HIDDEN, WHICH IS THE ARGUMENT FOR DOING IT THIS WAY.
# Retargeting these three files REMOVED §4.7 and §5.2a from core's published coverage pair —
# no pin-targeting model cites either — so the number went DOWN. That is the honest reading:
# after the retarget, nothing verifies those sections as the PIN states them. A header-sentence
# override would have left the figure untouched and the claim false.
#
# ALL THREE ENGINES MOVE TOGETHER. `docs/CORROBORATION.md` credits `conncodes` to TLC,
# Apalache and Spin. Three engines checking three different texts is one reading per snapshot
# presented as agreement, which is worse than one engine honestly scoped.
#
# SECOND USE, 2026-09-16 — the `resolution` subject, and it is the case the mechanism was
# always going to meet: not a section that MOVED but an obligation that DID NOT EXIST at the
# pin. `spec-data/v0.8.2` §3.1 states "The content_hash MUST match the map key" as a property
# of the ENVELOPE and names no operation on the receiver; the receiver's obligation, and the
# two mechanisms that discharge it, are §1.8 item 1 at 0.8.2.23. A model of the REPAIR cannot
# be a statement about a snapshot that does not contain it. All eight files move together —
# both green theories, both controls, both engines — for the reason stated above.
[track.core.model_pins]
"tla/ConnCodes.tla"                  = "v0.8.2.25"
"tla/ConnCodesApalache.tla"          = "v0.8.2.25"
"spin/conncodes.pml"                 = "v0.8.2.25"
"tamarin/Resolution.pv"              = "v0.8.2.25"
"tamarin/Resolution.spthy"           = "v0.8.2.25"
"tamarin/ResolutionBug.pv"           = "v0.8.2.25"
"tamarin/ResolutionBug.spthy"        = "v0.8.2.25"
"tamarin/ResolutionDiscard.pv"       = "v0.8.2.25"
"tamarin/ResolutionDiscard.spthy"    = "v0.8.2.25"
"tamarin/ResolutionDiscardBug.pv"    = "v0.8.2.25"
"tamarin/ResolutionDiscardBug.spthy" = "v0.8.2.25"

# ════════════════════════════════════════════════════════════════════════════════════════
# EXTENSION TRACKS — all three are modeled as of 2026-09-07. NONE is scoped, which is itself a
# fact about the gate below: `scoped` now has no subject in this registry.
#
# `status = "scoped"` is a real state with a gated meaning, not a placeholder: a scoped track
# MUST carry no models and no pin. The moment a model file is assigned to one of these,
# `trackcheck` fails until the track is promoted to "modeled" WITH a pin — which is the point.
# Promotion is the step where someone has to say out loud which snapshot the results are about,
# and it cannot be skipped by quietly adding a file.
#
# The gate did its job on 2026-09-07: `quorum` was promoted by writing
# `spec-data/MODELING-PIN-QUORUM` FIRST, because the three model files could not be declared
# until the pin existed. That is the whole intended sequence, and it is worth recording that it
# ran as designed rather than being worked around.
#
# All three specs are LANDED in `../entity-system-architecture/specs/extensions/` (26 extension
# specs live there) and ALL THREE ARE NOW VENDORED — see each track's `vendored` field.
#
# *(This block said, until 2026-09-07: "nothing is vendored yet only because `spec-data/` is
# held at the core pin until the keystone sibling converges, and the extension snapshots ride
# along with that same re-vendoring pass." That was an inference nobody checked, and it was
# wrong. Each extension spec declares `Depends: ENTITY-CORE-PROTOCOL.md (v7.40+)` — a FLOOR,
# which the pin already held clears. Core's pin is parked on keystone; the extension tracks
# pin independently, which is what the per-track `pin_file` field is for. Left in place rather
# than deleted because a retracted reason survives longest where it reads as background.)*
#
# Scoping and the ranked targets: docs/status/SCOPING-2026-09-06-IDENTITY-ATTESTATION.md.
# Start at attestation's substrate, not identity's 1,617 lines.
# ════════════════════════════════════════════════════════════════════════════════════════

[track.attestation]
kind         = "protocol"
status       = "modeled"
title        = "Attestation extension — the signed-edge substrate"
owner_repo   = "entity-system-architecture"
source_repo_path = "../entity-system-architecture"
source_dir       = "specs/extensions"
depends_note = "`ENTITY-CORE-PROTOCOL.md` (v7.40+) — met by `spec-data/v0.8.2`, which carries v7.62–v7.76 clause tags"
vendored     = "ext-attestation-v1.3"
cite_prefix  = "ATTEST"
pin_file     = "spec-data/MODELING-PIN-ATTESTATION"
primary_spec = "EXTENSION-ATTESTATION.md"
specs        = ["EXTENSION-ATTESTATION.md"]
coverage_doc     = "docs/COVERAGE-MATRIX.md"
coverage_heading = "Matrix A-ATT — attestation section × property class × engine"
models       = [
  "tla/AttestIndex.tla",
  "tla/AttestIndexApalache.tla",
  "tla/AttestLive.tla",
  "tla/AttestLiveApalache.tla",
  "tla/AttestRevoke.tla",
  "tla/AttestRevokeApalache.tla",
]
note = """
The substrate the other two consume: a system/attestation is a signed edge attesting→attested
with a properties.kind, plus a supersedes chain. Owns four mandatory indexes and the
chain-walk family. First target because every identity property is stated in terms of it, and
because two of its shapes reuse models this repo already trusts: index invariant I2
("partial-index states are NOT permitted") is RegisterAllOrNothing with four indexes instead
of five facets, and the chain walks are DeepChain/Bounds' termination question.

Two modules as of 2026-09-07. AttestIndex is a concurrency model in the house shape;
AttestLive is NOT — it is an exhaustive enumeration over every supersedes graph on three
nodes, because §4.3/§5.2/§5.3 are pure functions of one graph and the question is whether the
algorithm computes its own contract, not whether an interleaving can break it. Two of its
rows are findings against the spec rather than results about the protocol; they live in the
TLC_FINDING gate table and are routed in docs/status/ROUTING-2026-09-07-ATTESTATION-CHAIN-WALKS.md.

SECOND ENGINE, 2026-09-08 — partial, and the partiality is the point. AttestIndexApalache and
AttestLiveApalache carry two of this track's three modules to Apalache. AttestRevoke has none,
so the track is NOT corroborated as a whole; there is still no Spin encoding and still no
prover model at all (LEAN-SEAM O5), so the Dolev-Yao gap is untouched.

What the second engine did buy is worth naming: F1 — §5.3 cannot traverse a chain of three —
is now confirmed by a SECOND, structurally different method. TLC enumerates the graph space;
Apalache answers one SMT query over it. Both exhibit the counterexample on the green sweep's
own constants. What neither buys is independence from the transcription: both files are the
same author's reading of the same spec text, so a shared misreading survives both. That is the
5th wall, and adding engines does not move it.

Scope honestly: N = 3 on the Apalache side, parity with TLC and nothing more. Larger N is the
one thing the symbolic engine could give that the enumerator cannot, and it is future work —
the unrolling ladders are cut to what N = 3 needs because the deeper ones exceed the 2 GB cap.
`ConstInitLadderShort` is the control that makes that bound fail loudly at N = 4 instead of
silently truncating the graph.
"""

[track.quorum]
kind         = "protocol"
status       = "modeled"
title        = "Quorum extension — K-of-N signer rosters"
owner_repo   = "entity-system-architecture"
source_repo_path = "../entity-system-architecture"
source_dir       = "specs/extensions"
depends_note = "`ENTITY-CORE-PROTOCOL.md` (v7.40+); `EXTENSION-ATTESTATION.md` (v1.2+) — both met by the vendored snapshots"
vendored     = "ext-quorum-v1.2"
cite_prefix  = "QUORUM"
pin_file     = "spec-data/MODELING-PIN-QUORUM"
primary_spec = "EXTENSION-QUORUM.md"
specs        = ["EXTENSION-QUORUM.md"]
coverage_doc     = "docs/COVERAGE-MATRIX.md"
coverage_heading = "Matrix A-QRM — quorum section × property class × engine"
models       = [
  "tla/QuorumKofN.tla",
  "tla/QuorumKofNApalache.tla",
  "tla/QuorumSignerSet.tla",
  "tla/QuorumSignerSetApalache.tla",
  "tla/QuorumTrust.tla",
  "tla/QuorumTrustApalache.tla",
]
note = """
A system/quorum is a signer roster + threshold whose own membership changes are attestations
(quorum-update, quorum-publish). Promoted scoped -> modeled on 2026-09-07 by writing
spec-data/MODELING-PIN-QUORUM, which is the step the `scoped` gate exists to force.

THE TWO QUESTIONS THIS NOTE CARRIED BEFORE ANY MODEL EXISTED ARE BOTH ANSWERED, AND BOTH
ANSWERS ARE WORSE THAN THE QUESTIONS. They are left in place below rather than rewritten,
because what a pre-model hypothesis got right and wrong is the thing worth reading later
(LEAN-SEAM O6 is the precedent: the written-down hypothesis was half right and backwards on
the interesting half).

  (1) "A quorum-update is validated at ARRIVAL and then trusted on every read [...] So the
      whole live signer set rests on every write path running arrival-time validation, and
      nothing states that every path does." -- RIGHT about the assumption, WRONG that it is
      merely unstated. §4.2's cold-start posture asserts it outright ("tree-bound only on
      validation success"), and two other sentences in the same document falsify it: §4.2.1
      non-trigger 1 ("may sit in the tree at a structurally-valid path without being
      authoritative") and §8 ("Direct tree:put [...] is permitted"). tla/QuorumTrust.tla
      exhibits it in TWO STEPS with §8 switched off. LEAN-SEAM O11.
  (2) "current_signer_set(as_of) -- verdict determinism over a declared temporal input [...]
      Model not_before and the clock explicitly from the start." -- this was the right call
      and it paid. With the clock in, EXTENSION-ATTESTATION §4.3's undefined `not_expired`
      separates into two readings that disagree about whether a SCHEDULED membership change
      destroys the current signer set. AttestRevoke's DescReadingsCoincide green is scoped to
      a model with no not_before and does not cover this; that is O9 firing again on the
      module written to close it.

Six findings routed: docs/status/ROUTING-2026-09-07-QUORUM.md.

SECOND ENGINE, 2026-09-08 — TWO of three modules. tla/QuorumKofNApalache.tla carries §4.1 to
Apalache. It went first because §4.1 has no recursion (the cheapest port on this track) and
because it is the validator §2 calls "the only mechanism that distinguishes quorum from a
regular peer node". Note where that lands: the module that got the second engine first is
precisely the one whose real property -- unforgeability -- neither engine can express.
Cryptography is a per-peer boolean in both transcriptions, and LEAN-SEAM O14 is untouched by
either. (QuorumTrust was still TLC-only when this was written; it gained Apalache on 2026-09-09 — see below.) There is no Spin encoding here and NO PROVER.

tla/QuorumSignerSetApalache.tla (2026-09-09) is the second, and it was written to run ONE
EXPERIMENT rather than to add corroboration -- LEAN-SEAM O20, which is a row a RULE went looking
for (AGENTS.md D15's tenth shape) rather than one a model produced. QuorumSignerSet.tla's `Init`
restricts the supersedes pointer to lower indices UNCONDITIONALLY, the identical shape that on
tla/AttestRevoke.tla hid a requirement stronger than the prose drawn from it (F5/O10). Lifting
it here as a constant answers the question that file could not ask, and the answer is NOT
AttestRevoke's:

  - FOUR of §4.2's five checked properties are unaffected by the lifted order.
  - `CohortNeverSilentlyReverts` is VIOLATED, on a supersedes cycle -- §4.2 hands back the
    roster frozen at `:create` while a quorum-update sits in the tree inside its validity
    window, because a node on a cycle is its own transitive descendant and §ATTEST:4.3 calls
    any attestation with a live descendant dead. Q8, and it reaches Q2's consequence by a route
    with no walk defect in it at all.
  - `CohortNeverSilentlyRevertsWhenAcyclic` is GREEN, so the index order was STRICTLY STRONGER
    than what §4.2 needs and what it was standing in for is acyclicity -- which §6.2 does not
    validate, §3.2 describes only in prose, and content addressing supplies for the same
    unstated reason it does in §ATTEST:4.3.

The first counterexample was a self-superseding attestation (`sup = <<1, 1, 2>>`), which is a
true instance and the wrong one to route; `CohortNeverSilentlyRevertsNoSelfLoop` forbids it and
is violated on a genuine two-node cycle. Both rows are kept, for the reason the attestation
note gives about guards: a finding whose stated mechanism is not the one its counterexample
exhibits is docs/PROPERTIES.md §D.1 happening again.

THIRD PORT, 2026-09-09 — tla/QuorumTrustApalache.tla, which closes the last single-engine subject
anywhere on the extension tracks and corrected a CLAIM rather than finding a defect. §4.2.1's
cache-invalidation contract has THREE triggers; tla/QuorumTrust.tla has an action for two, and
ROUTING-2026-09-07-QUORUM.md published "the §4.2.1 contract is exactly sufficient" naming those
same two. The correction is measured and favours the spec: with the revocation action added,
CacheMatchesValidated is green and INDUCTIVE over all three. The falsification of the old
two-trigger form is a required-violation row (OnlyAcceptInvalidates), so it cannot go quiet again.

The D18 sweep had ALREADY looked at this module and cleared it — "`~cached[q]` on Walk is the
algorithm, not a restriction" — which is true of that guard and was the wrong question. The three
restrictions were elsewhere: the missing trigger-3 action, a MONOTONE TREE (§8 permits
tree:put(path, null) and no action unbinds), and one arrival per attestation. The middle one
amends Q5: the closure we published as the remedy is READ-side, and with unbinds admitted it holds
while the cache still goes stale, because non-trigger 2 forbids invalidating on the write that
removed the entry. What §4.2 needs is WRITE-side — the readable set changes only through
validate-accept. LEAN-SEAM O11 restated, still OPEN; routed in
docs/status/ROUTING-2026-09-09-QUORUM-CACHE-WRITE-CLOSURE.md, whose §5 DECLARES that the cohort
census for the two new directions was not taken. All three quorum modules now carry two engines;
there is still no Spin encoding and NO PROVER (LEAN-SEAM O14).
"""

